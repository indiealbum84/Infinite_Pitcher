            document.getElementById('ranking-btn').innerText       = t.rankingBtn;
            document.getElementById('close-ranking-btn').innerText = t.closeBtn;
            document.getElementById('home-btn').innerText               = t.homeBtn;
            document.getElementById('intro-ranking-close-btn').innerText = t.rankingClose;
        }

        function onLangSelect(lang) {
            applyLang(lang);
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
            audioCtx.resume().then(() => {
                const silentBuf = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
                const silentSrc = audioCtx.createBufferSource();
                silentSrc.buffer = silentBuf;
                silentSrc.connect(audioCtx.destination);
                silentSrc.start(0);
                playTitleBgm();
            });
        }

        document.getElementById('lang-ko-btn').addEventListener('click', (e) => { e.stopPropagation(); onLangSelect('ko'); });
        document.getElementById('lang-ja-btn').addEventListener('click', (e) => { e.stopPropagation(); onLangSelect('ja'); });

        const splashScreen = document.getElementById('splash-screen');

        function playGameBgm() {
            stopAllBgm();
            console.log('[BGM] playGameBgm called. buffer:', !!gameBgmBuffer, '/ audioCtx.state:', audioCtx.state);
            if (gameBgmBuffer) {
                audioCtx.resume().then(() => {
                    console.log('[BGM] AudioContext resumed, starting Web Audio loop');
                    const src = audioCtx.createBufferSource();
                    src.buffer    = gameBgmBuffer;
                    src.loop      = true;
                    src.loopStart = 0;
                    src.loopEnd   = gameBgmLoopEnd;
                    src.connect(audioCtx.destination);
                    src.start(0);
                    gameBgmSource = src;
                });
            } else {
                console.log('[BGM] buffer null → fallback HTMLAudioElement');
                bgmGameUseEl = true;
                bgmGameEl.currentTime = 0;
                bgmGameEl.play().catch(e => console.warn('[BGM] fallback play failed:', e));
            }
        }

        function playCountdownSfx() {
            playSfx('countdown', 1.0);
        }

        function playStartSfx() {
            playSfx('start', 1.0);
        }

        /**
         * GAME CONFIGURATION & STATE
         */
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const nextNumEl = document.getElementById('next-num');
        const finalScoreEl = document.getElementById('final-score-val');
        const startBtn = document.getElementById('start-btn-id');

        let testMode = false;

        function selectTestMode() {
            testMode = !testMode;
            document.getElementById('test-btn').classList.toggle('active', testMode);
        }

        startBtn.addEventListener('click', () => {
            if (gameState === 'INTRO') startGame();
        });

        let width, height;
        let gameState = 'INTRO'; // INTRO, PLAYING, GAMEOVER
        let score = 0;
        let nextExpectedNumber = 1;
        let lastPitchTime = 0;
        const pitchInterval = 1000;

        let player = { x: 0, y: 0, width: 60, height: 80 };
        let blocks = [];
        let balls = [];
        let scrollY = 0;
        let targetScrollY = 0;

        let destroyedNumbers  = new Set();
        let fireballCharging  = false;
        let fireballActive    = false;
        let fireballColumn    = -1;
        let mirrorballActive  = false; // 현재 숫자 반전 중 여부

        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyDZ8_PYjpQxnKYcQJWx9DUHeHUSQ1cVSsA",
            authDomain: "infinite-pitcher.firebaseapp.com",
            projectId: "infinite-pitcher",
            storageBucket: "infinite-pitcher.firebasestorage.app",
            messagingSenderId: "134868428008",
            appId: "1:134868428008:web:ef83005b900899c606d55d",
            databaseURL: "https://infinite-pitcher-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        /**
         * INITIALIZATION
         */
        const BASE_W = 390;
        const BASE_H = 844;

        function resize() {
            width = canvas.width = BASE_W;
            height = canvas.height = BASE_H;
            player.x = width / 2;
            player.y = height - 105;

            const scaleX = window.innerWidth / BASE_W;
            const scaleY = window.innerHeight / BASE_H;
            const scale = Math.min(scaleX, scaleY);
            const wrapper = document.getElementById('game-wrapper');
            wrapper.style.transform = `scale(${scale})`;
            wrapper.style.marginTop = '0';
        }
        window.addEventListener('resize', resize);
        resize();


        /**
         * BLOCK MANAGEMENT
         */
        function createRow(startNum) {
            let row = [];
            let numbers = [];
            for (let i = 0; i < 10; i++) numbers.push(startNum + i);
            // Shuffle inside row
            numbers.sort(() => Math.random() - 0.5);

            const blockSize = width / 10;
            for (let i = 0; i < 10; i++) {
                row.push({
                    x: i * blockSize,
                    y: 0,
                    num: numbers[i],
                    active: true,
                    size: blockSize
                });
            }
            return row;
        }

        function initBlocks() {
            blocks = [];
            for (let r = 0; r < 10; r++) {
                let row = createRow(r * 10 + 1);
                row.forEach(b => b.y = (9 - r) * (width / 10)); // 역순 배치
                blocks.push(...row);
            }
        }

        /**
         * INPUT HANDLING
         */
        let isDragging = false;

        function handleStart(clientX) {
            if (testMode) return;
            if (gameState !== 'PLAYING' && gameState !== 'COUNTDOWN') return;
            isDragging = true;
            updatePlayerPosition(clientX);
        }

        function handleMove(clientX) {
            if (testMode) return;
            if (!isDragging) return;
            if (gameState !== 'PLAYING' && gameState !== 'COUNTDOWN') return;
            updatePlayerPosition(clientX);
        }

        function handleEnd() {
            isDragging = false;
        }

        function updatePlayerPosition(clientX) {
            const rect = canvas.getBoundingClientRect();
            const canvasX = ((clientX - rect.left) / rect.width) * width;
            player.x = Math.max(8, Math.min(width - 8, canvasX));
        }

        // Mouse Events
        canvas.addEventListener('mousedown', (e) => {
            handleStart(e.clientX);
        });

        window.addEventListener('mousemove', (e) => {
            handleMove(e.clientX);
        });

        window.addEventListener('mouseup', () => {
            handleEnd();
        });

        // Touch Events — 터치 시 AudioContext resume (iOS 요구사항)
        canvas.addEventListener('touchstart', (e) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (e.touches.length > 0) {
                handleStart(e.touches[0].clientX);
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length > 0) {
                handleMove(e.touches[0].clientX);
                if (e.cancelable) e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('touchend', () => {
            handleEnd();
        });

        window.addEventListener('touchcancel', () => {
            handleEnd();
        });

        /**
         * GAME LOGIC
         */
        function startCountdown() {
            gameState = 'COUNTDOWN';
            score = 0;
            nextExpectedNumber = 1;
            balls = [];
            scrollY = 0;
            targetScrollY = 0;
            destroyedNumbers = new Set();
            fireballCharging = false;
            fireballActive   = false;
            fireballColumn   = -1;
            mirrorballActive = false;
            initBlocks();
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('hidden');
            updateUI();

            const countdownScreen = document.getElementById('countdown-screen');
            const countdownText = document.getElementById('countdown-text');
            countdownScreen.classList.remove('hidden');

            // 안내 문구 표시 — 클릭/터치하면 카운트다운 시작
            countdownText.innerText = TEXTS[currentLang].instruction;
            countdownText.style.color = '#ffffff';
            countdownText.style.textShadow = 'none';
            countdownText.style.fontSize = '20px';
            countdownText.style.whiteSpace = 'pre-line';

            let count = 3;
            fadeTitleBgm(5000);

            const startCountdownTick = () => {
                countdownText.style.fontSize = '';
                countdownText.style.whiteSpace = '';
                countdownScreen.removeEventListener('click', startCountdownTick);
                countdownScreen.removeEventListener('touchstart', startCountdownTick);
                countdownScreen.style.pointerEvents = 'none';
                countdownScreen.dataset.waiting = 'false';

            const runTick = () => {
                if (count > 0) {
                    countdownText.innerText = count;
                    countdownText.style.color = 'var(--primary-neon)';
                    countdownText.style.textShadow = '0 0 20px rgba(204, 255, 0, 0.8)';

                    countdownText.classList.remove('countdown-animate');
                    void countdownText.offsetWidth;
                    countdownText.classList.add('countdown-animate');

                    playCountdownSfx();
                    count--;
                    setTimeout(runTick, 1000);
                } else if (count === 0) {
                    countdownText.innerText = 'START!';
                    countdownText.style.color = '#ff4444';
                    countdownText.style.textShadow = '0 0 20px rgba(255, 68, 68, 0.8)';

                    countdownText.classList.remove('countdown-animate');
                    void countdownText.offsetWidth;
                    countdownText.classList.add('countdown-animate');

                    // start.mp3 재생 → 끝나는 순간 bgm_game 시작
                    audioCtx.resume().then(() => {
                        const buf = sfxBuffers['start'];
                        if (buf) {
                            const src = audioCtx.createBufferSource();
                            src.buffer = buf;
                            src.connect(audioCtx.destination);
                            src.onended = () => { playGameBgm(); };
                            src.start(0);
                        } else {
                            playGameBgm();
                        }
                    });

                    count--;
                    setTimeout(runTick, 1000);
                } else {
                    countdownScreen.classList.add('hidden');
                    gameState = 'PLAYING';
                    lastPitchTime = performance.now();
                }
            };

            runTick();
            requestAnimationFrame(gameLoop);
            };

            // 대전 모드에서는 안내 문구 없이 바로 카운트다운 시작
            if (battleMode) {
                startCountdownTick();
            } else {
                countdownScreen.dataset.waiting = 'true';
                countdownScreen.style.pointerEvents = 'auto';
                countdownScreen.addEventListener('click', startCountdownTick);
                countdownScreen.addEventListener('touchstart', startCountdownTick, { passive: true });
            }
        }



        function startGame() {
            startCountdown();
        }

        // 테스트용: n번부터 시작
        function testSkipTo(n) {
            if (gameState !== 'PLAYING') return;
            const target = n - 1;

            // 상태 초기화 후 재구성
            balls = [];
            destroyedNumbers = new Set();
            for (let i = 1; i <= target; i++) destroyedNumbers.add(i);

            nextExpectedNumber = n;
            score = target;
            fireballCharging = false;
            fireballActive   = false;
            fireballColumn   = -1;
            mirrorballActive = false;

            // 블록 완전 재생성 — initBlocks와 동일한 방식으로 10행 배치
            const blockSize     = width / 10;
            const clearedRows   = Math.floor(target / 10);
            const firstRowStart = clearedRows * 10 + 1; // 화면에 나올 첫 행

            blocks = [];
            for (let r = 0; r < 10; r++) {
                const row = createRow(firstRowStart + r * 10);
                row.forEach(b => b.y = (9 - r) * blockSize);
                blocks.push(...row);
            }

            // 스크롤 0으로 초기화 (블록을 새로 배치했으므로)
            scrollY = 0;
            targetScrollY = 0;

            updateUI();
        }

        function gameOver() {
            if (testMode) return;
            gameState = 'GAMEOVER';
            stopAllBgm();
            finalScoreEl.innerText = score;
            if (battleMode) {
                // 대전 모드: 효과음은 결과 화면에서 승패에 따라 재생
                battleGameOver();
            } else {
                playSfx('gameover', 1.0);
                document.getElementById('game-over-screen').classList.remove('hidden');
                evaluateScore(score);
            }
        }

        function updateUI() {
            scoreEl.innerText = score;
            nextNumEl.innerText = nextExpectedNumber;
            if (battleMode) battleSyncScore();
        }

        function pitchBall(isFireball) {
            const isMirrorBall = !isFireball && nextExpectedNumber === 101;
            balls.push({
                x: player.x,
                y: player.y - 20,
                radius: isFireball ? 14 : 8,
                speed: isFireball ? 12 : 10,
                isFireball: !!isFireball,
                isMirrorBall: isMirrorBall,
                activated: false,
                column: Math.floor(player.x / (width / 10)),
                fireballStart: isFireball ? nextExpectedNumber : 0
            });
            if (isFireball) {
                playSfx('throw_fireball', 1.0);
            } else if (isMirrorBall) {
                playSfx('throw_mirrorball', 1.0);
            } else {
                playThrow();
            }
        }

        function mirrorDisplay(num) {
            if (mirrorballActive) {
                return String(num).split('').reverse().join('');
            }
            return String(num);
        }

        function triggerMirrorball() {
            mirrorballActive = true;
            playSfx('mirrorball', 1.0);
            const mbAnnounce = document.getElementById('mirrorball-announce');
            mbAnnounce.classList.remove('show');
            void mbAnnounce.offsetWidth;
            mbAnnounce.classList.add('show');
        }

        // nextExpectedNumber를 올릴 때 파괴된 번호 건너뜀 + 미러볼 트리거/해제
        function advanceExpected() {
            const prev = nextExpectedNumber;
            nextExpectedNumber++;
            while (destroyedNumbers.has(nextExpectedNumber)) {
                nextExpectedNumber++;
            }
            // 101번 딱 한 번만 미러볼 발동
            if (prev === 101) {
                triggerMirrorball();
                lastPitchTime = performance.now() + 3800; // 애니메이션 1.8초 + 2초
            }
        }

        function update(timestamp) {
            if (gameState !== 'PLAYING') return;

            // 테스트 모드: nextExpectedNumber 블록 위치로 자동 이동
            if (testMode) {
                const targetBlk = blocks.find(b => b.active && b.num === nextExpectedNumber);
                if (targetBlk) {
                    const targetX = targetBlk.x + targetBlk.size / 2;
                    const diff = targetX - player.x;
                    player.x += diff * 0.15; // 부드럽게 이동
                    player.x = Math.max(8, Math.min(width - 8, player.x));
                }
            }

            // Auto Pitching — 차징 중이거나 파이어볼 비행 중이면 투구 차단
            const currentPitchInterval = nextExpectedNumber <= 30 ? 1200 : pitchInterval;
            if (!fireballCharging && !fireballActive && timestamp - lastPitchTime > currentPitchInterval) {
                lastPitchTime = timestamp;

                // 31, 131, 231... → 파이어볼
                const isFireballTurn = (nextExpectedNumber - 31) % 100 === 0 && nextExpectedNumber >= 31;
                if (isFireballTurn) {
                    // 파이어볼 차징: 0.8초 딜레이 후 발사
                    fireballCharging = true;
                    fireballColumn   = Math.floor(player.x / (width / 10));
                    playSfx('fireball', 1.0);

                    const fbAnnounce = document.getElementById('fireball-announce');
                    fbAnnounce.classList.remove('show');
                    void fbAnnounce.offsetWidth;
                    fbAnnounce.classList.add('show');

                    // 애니메이션 1.2초 + 2초 딜레이 후 발사
                    setTimeout(() => {
                        fireballCharging = false;
                        fireballColumn   = -1;
                        fireballActive   = true;
                        pitchBall(true);
                    }, 3200);
                } else {
                    pitchBall(false);
                }
            }

            // Update Balls
            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                b.y -= b.speed;

                if (b.isFireball) {
                    // 파이어볼: 같은 열에서 공이 닿은 블록 처리
                    // 파괴 범위: 해당 사이클 끝까지 (31번→1~130, 131번→131~230...)
                    const fbCycleEnd = b.fireballStart + 99; // fireballStart = 파이어볼 발사 시점 nextExpectedNumber
                    let spliced = false;
                    for (let j = 0; j < blocks.length; j++) {
                        let blk = blocks[j];
                        if (!blk.active) continue;
                        let blkCol = Math.floor(blk.x / (width / 10));
                        if (blkCol !== b.column) continue;
                        let blkY = blk.y + scrollY;
                        if (!(b.y < blkY + blk.size && b.y > blkY - b.radius)) continue;

                        if (!b.activated) {
                            if (blk.num !== nextExpectedNumber) {
                                gameOver();
                                spliced = true;
                                break;
                            }
                            b.activated = true;
                            blk.active = false;
                            score++;
                            playSfx('throw_hit', 1.0);
                            advanceExpected();
                            updateUI();
                            checkRowClear(); // 맞춘 블록(31번)에서만 1번 스크롤 체크
                        } else {
                            // 사이클 범위 내 블록만 파괴 — score에 포함 안 함
                            if (blk.num <= fbCycleEnd) {
                                blk.active = false;
                                destroyedNumbers.add(blk.num);
                                playSfx('throw_hit', 0.5);
                            }
                        }
                    }
                    // nextExpectedNumber가 파괴된 번호면 건너뜀
                    while (destroyedNumbers.has(nextExpectedNumber)) {
                        nextExpectedNumber++;
                    }
                    if (!spliced) updateUI();
                    if (!spliced && b.y < -20) {
                        balls.splice(i, 1);
                        fireballActive = false;
                        lastPitchTime = performance.now();
                    }
                } else {
                    // 일반 공: 겹침 면적이 가장 넓은 블록으로 판정
                    let bestBlk = null;
                    let bestArea = 0;
                    for (let j = 0; j < blocks.length; j++) {
                        let blk = blocks[j];
                        if (!blk.active) continue;
                        let blkY = blk.y + scrollY;
                        const overlapX = Math.min(b.x + b.radius, blk.x + blk.size) - Math.max(b.x - b.radius, blk.x);
                        const overlapY = Math.min(b.y + b.radius, blkY + blk.size) - Math.max(b.y - b.radius, blkY);
                        if (overlapX > 0 && overlapY > 0) {
                            const area = overlapX * overlapY;
                            if (area > bestArea) { bestArea = area; bestBlk = blk; }
                        }
                    }
                    if (bestBlk) {
                        if (bestBlk.num === nextExpectedNumber) {
                            bestBlk.active = false;
                            score++;
                            advanceExpected();
                            balls.splice(i, 1);
                            playSfx('throw_hit', 1.0);
                            updateUI();
                            checkRowClear();
                        } else {
                            gameOver();
                            return;
                        }
                    } else if (b.y < -20) {
                        balls.splice(i, 1);
                    }
                }
            }

            // Smooth Scrolling
            if (scrollY < targetScrollY) {
                scrollY += 2;
            }
        }

        function checkRowClear() {
            const targetRowsCleared = Math.floor(score / 10);
            const currentRowsCleared = Math.round(targetScrollY / (width / 10));

            if (targetRowsCleared > currentRowsCleared) {
                targetScrollY = targetRowsCleared * (width / 10);
                const maxNum = Math.max(...blocks.map(b => b.num));
                let newRow = createRow(maxNum + 1);
                const topMostY = Math.min(...blocks.map(b => b.y));
                newRow.forEach(b => b.y = topMostY - (width / 10));
                blocks.push(...newRow);
            }
        }

        /**
         * RENDERING
         */
        function draw() {
            ctx.clearRect(0, 0, width, height);

            // 잔디 배경 — 짝수/홀수 줄을 교차해 자연스러운 잔디 줄무늬 연출
            const stripeW = width / 10;
            const stripeColors = ['#2d7a2d', '#3a8f3a'];
            for (let i = 0; i < 10; i++) {
                ctx.fillStyle = stripeColors[i % 2];
                ctx.fillRect(i * stripeW, 0, stripeW, height);
            }

            // 잔디 질감 — 세로 방향 미세 하이라이트
            for (let i = 0; i < 10; i++) {
                const gx = i * stripeW;
                const grad = ctx.createLinearGradient(gx, 0, gx + stripeW, 0);
                grad.addColorStop(0,   'rgba(255,255,255,0.04)');
                grad.addColorStop(0.5, 'rgba(255,255,255,0.10)');
                grad.addColorStop(1,   'rgba(255,255,255,0.04)');
                ctx.fillStyle = grad;
                ctx.fillRect(gx, 0, stripeW, height);
            }

            // 흰색 세로 라인
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = 1;
            for (let i = 1; i < 10; i++) {
                ctx.beginPath();
                ctx.moveTo(i * stripeW, 0);
                ctx.lineTo(i * stripeW, height);
                ctx.stroke();
            }

            // 파이어볼 차징 중: 해당 열 강조
            if (fireballCharging && fireballColumn >= 0) {
                ctx.fillStyle = 'rgba(255, 120, 0, 0.25)';
                ctx.fillRect(fireballColumn * stripeW, 0, stripeW, height);
            }

            // Draw pitch guide line
            ctx.save();
            ctx.setLineDash([6, 8]);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - 20);
            ctx.lineTo(player.x, 0);
            ctx.stroke();
            ctx.restore();

            // Draw Blocks
            blocks.forEach(blk => {
                if (!blk.active) return;
                let drawY = blk.y + scrollY;
                if (drawY > height || drawY < -blk.size) return;

                const isNext = blk.num === nextExpectedNumber;
                const isFireballNext = (nextExpectedNumber - 31) % 100 === 0 && nextExpectedNumber >= 31;
                const isMirrorNext   = nextExpectedNumber === 101;
                const isGuide = isNext && (nextExpectedNumber === 1 || isFireballNext || isMirrorNext);
                ctx.fillStyle = isGuide ? varColor('--primary-neon') : '#ffffff';
                ctx.fillRect(blk.x + 2, drawY + 2, blk.size - 4, blk.size - 4);

                ctx.font = '700 17px "Noto Sans JP", Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const tx = blk.x + blk.size / 2;
                const ty = drawY + blk.size / 2;
                const label = mirrorDisplay(blk.num);
                if (!isGuide) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.lineJoin = 'round';
                    ctx.strokeText(label, tx, ty);
                }
                ctx.fillStyle = '#000000';
                ctx.fillText(label, tx, ty);
            });

            // Draw Balls
            balls.forEach(b => {
                if (b.isFireball) {
                    // 불꽃 외곽 글로우
                    const glowGrad = ctx.createRadialGradient(b.x, b.y, b.radius * 0.5, b.x, b.y, b.radius * 3.5);
                    glowGrad.addColorStop(0,   'rgba(255, 220, 50, 0.9)');
                    glowGrad.addColorStop(0.4, 'rgba(255, 100, 0, 0.6)');
                    glowGrad.addColorStop(1,   'rgba(255, 30, 0, 0)');
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius * 3.5, 0, Math.PI * 2);
                    ctx.fillStyle = glowGrad;
                    ctx.fill();

                    // 불꽃 튀기 파티클 (고정 시드 패턴)
                    const spikes = 8;
                    for (let s = 0; s < spikes; s++) {
                        const angle  = (s / spikes) * Math.PI * 2 + performance.now() * 0.005;
                        const len    = b.radius * (2.2 + Math.sin(performance.now() * 0.02 + s) * 0.8);
                        ctx.beginPath();
                        ctx.moveTo(b.x, b.y);
                        ctx.lineTo(b.x + Math.cos(angle) * len, b.y + Math.sin(angle) * len);
                        ctx.strokeStyle = `rgba(255, ${100 + s * 15}, 0, 0.8)`;
                        ctx.lineWidth = 3;
                        ctx.stroke();
                    }

                    // 파이어볼 본체
                    const fbGrad = ctx.createRadialGradient(b.x - b.radius * 0.3, b.y - b.radius * 0.3, 1, b.x, b.y, b.radius);
                    fbGrad.addColorStop(0,   '#fff7a0');
                    fbGrad.addColorStop(0.4, '#ff9900');
                    fbGrad.addColorStop(1,   '#cc2200');
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = fbGrad;
                    ctx.fill();
                } else if (b.isMirrorBall) {
                    // 101번 공 — 손거울 모양
                    const r = b.radius;
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    // 거울 원형 부분
                    const mirGrad = ctx.createRadialGradient(-r*0.3, -r*0.3, 1, 0, 0, r);
                    mirGrad.addColorStop(0, '#ffffff');
                    mirGrad.addColorStop(0.4, '#c8e8ff');
                    mirGrad.addColorStop(1, '#7ab8d8');
                    ctx.beginPath();
                    ctx.arc(0, -r * 0.3, r, 0, Math.PI * 2);
                    ctx.fillStyle = mirGrad;
                    ctx.fill();
                    ctx.strokeStyle = '#888888';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    // 반짝임
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.beginPath();
                    ctx.arc(-r * 0.35, -r * 0.6, r * 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    // 손잡이
                    ctx.beginPath();
                    ctx.roundRect(-r * 0.25, r * 0.6, r * 0.5, r * 0.9, r * 0.15);
                    ctx.fillStyle = '#a0785a';
                    ctx.fill();
                    ctx.strokeStyle = '#7a5a3a';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                    ctx.restore();
                } else {
                    // 일반 야구공
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.strokeStyle = '#ff3b30';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(b.x - b.radius * 0.7, b.y, b.radius * 0.8, -Math.PI/3, Math.PI/3);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(b.x + b.radius * 0.7, b.y, b.radius * 0.8, 2*Math.PI/3, 4*Math.PI/3);
                    ctx.stroke();
                }
            });

            // Draw Player & Cart
            drawPlayer();
        }

        function drawPlayer() {
            const px = player.x;
            const py = player.y;

            // cart.png — 아래쪽 (크기 축소)
            const cartW = Math.min(width * 0.13, 65);
            const cartH = cartImg.naturalHeight ? (cartW * cartImg.naturalHeight / cartImg.naturalWidth) : 40;
            ctx.drawImage(cartImg, px - cartW / 2, py + 40, cartW, cartH);

            // pitcher.png — 카트 바로 위에 붙임
            const pitcherW = Math.min(width * 0.16, 80);
            const pitcherH = pitcherImg.naturalHeight ? (pitcherW * pitcherImg.naturalHeight / pitcherImg.naturalWidth) : 100;
            ctx.drawImage(pitcherImg, px - pitcherW / 2, py - pitcherH - cartH + 120, pitcherW, pitcherH);
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function gameLoop(timestamp) {
            update(timestamp);
            draw();
            if (gameState === 'PLAYING' || gameState === 'COUNTDOWN') requestAnimationFrame(gameLoop);
        }

        /**
         * LEADERBOARD — Firebase Realtime Database
         */
        let pendingScore = null;
        const ranksRef = db.ref('ranks');
        const CACHE_KEY = 'infinitePitcherRanksCache';

        function getCachedRanks() {
            try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '[]'); } catch(e) { return []; }
        }
        function setCachedRanks(ranks) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(ranks)); } catch(e) {}
        }

        function fetchRanks(callback) {
            ranksRef.orderByChild('score').limitToLast(100).once('value')
                .then(snapshot => {
                    const ranks = [];
                    snapshot.forEach(child => {
                        const v = child.val();
                        // 이름 없거나 점수 0인 더미 데이터 제외
                        if (v && v.score > 0 && v.name && v.name.trim() !== '') ranks.push(v);
                    });
                    ranks.sort((a, b) => b.score - a.score);
                    setCachedRanks(ranks);
                    callback(ranks);
                })
                .catch(() => {
                    callback(getCachedRanks());
                });
        }

        function evaluateScore(newScore) {
            pendingScore = newScore;
            fetchRanks(ranks => {
                const tempEntry = { score: newScore, name: '', date: new Date().toLocaleDateString() };
                const merged = [...ranks, tempEntry].sort((a, b) => b.score - a.score).slice(0, 100);
                const tempIdx = merged.findIndex(r => r === tempEntry);
                // 공동순위: 같은 점수 중 가장 앞 인덱스 기준
                const rank = merged.findIndex(r => r.score === newScore) + 1;

                const entryEl     = document.getElementById('rank-entry');
                const registerBtn = document.getElementById('register-btn');
                const rankVal     = document.getElementById('my-rank-val');
                const nameInput   = document.getElementById('player-name-input');

                if (tempIdx >= 0 && tempIdx < 100) {
                    rankVal.innerText = rank;
                    nameInput.value = '';
                    entryEl.classList.remove('hidden');
                    registerBtn.classList.remove('hidden');
                    setTimeout(() => nameInput.focus(), 300);
                } else {
                    entryEl.classList.add('hidden');
                    registerBtn.classList.add('hidden');
                }
            });
        }

        function registerName() {
            const nameInput = document.getElementById('player-name-input');
            const name = nameInput.value.trim() || 'NO NAME';
            const score = pendingScore;
            pendingScore = null;

            document.getElementById('rank-entry').classList.add('hidden');
            document.getElementById('register-btn').classList.add('hidden');

            const list = document.getElementById('rank-list');
            list.innerHTML = '<div style="color:#aaa;padding:20px;">등록 중...</div>';
            const modal = document.getElementById('leaderboard-modal');
            modal.classList.remove('hidden');

            // push 완료 후 최신 데이터 렌더링
            ranksRef.push({ score, name, date: new Date().toLocaleDateString() })
                .then(() => fetchRanks(ranks => renderRankRows(list, ranks, name, score)))
                .catch(() => fetchRanks(ranks => renderRankRows(list, ranks, name, score)));
        }

        function renderRankList(highlightName) {
            const list = document.getElementById('rank-list');
            const cached = getCachedRanks();
            if (cached.length > 0) renderRankRows(list, cached, highlightName, null);
            else list.innerHTML = '<div style="color:#aaa;padding:20px;">불러오는 중...</div>';

            fetchRanks(ranks => {
                if (ranks.length === 0) {
                    list.innerHTML = '<div style="color:#aaa;padding:20px;">아직 기록이 없습니다</div>';
                    return;
                }
                renderRankRows(list, ranks, highlightName, null);
            });
        }

        function renderRankRows(list, ranks, highlightName, highlightScore) {
            const badge = document.getElementById('my-rank-badge');

            // 공동순위 계산: 앞 항목과 점수 같으면 같은 순위
            const displayRanks = [];
            let currentRank = 1;
            ranks.forEach((r, i) => {
                if (i > 0 && r.score === ranks[i - 1].score) {
                    displayRanks.push(displayRanks[i - 1]);
                } else {
                    currentRank = i + 1;
                    displayRanks.push(currentRank);
                }
            });

            let myRankIdx = -1;
            if (highlightName) {
                myRankIdx = ranks.findIndex(r =>
                    r.name === highlightName && (highlightScore === null || r.score === highlightScore)
                );
            }

            if (myRankIdx >= 0 && badge) {
                badge.style.display = 'block';
                badge.innerText = `🏆 ${displayRanks[myRankIdx]}위 달성!`;
            } else if (badge) {
                badge.style.display = 'none';
            }

            list.innerHTML = ranks.map((r, i) => {
                const isMe = i === myRankIdx;
                return `<div class="rank-item${isMe ? ' is-me' : ''}">
                    <span class="rank-num">#${displayRanks[i]}</span>
                    <span class="rank-name">${r.name || 'NO NAME'}</span>
                    <span class="rank-score">${r.score} PTS</span>
                </div>`;
            }).join('');

            // 내 순위로 자동 스크롤
            if (myRankIdx >= 0) {
                setTimeout(() => {
                    const items = list.querySelectorAll('.rank-item');
                    if (items[myRankIdx]) items[myRankIdx].scrollIntoView({ block: 'center', behavior: 'smooth' });
                }, 100);
            }
        }

        function toggleLeaderboard() {
            const modal = document.getElementById('leaderboard-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                renderRankList(null);
            }
        }

        // 탭 숨김 / 창 닫힘 시 BGM 정지
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') stopAllBgm();
        });
        window.addEventListener('pagehide', () => stopAllBgm());

        draw();

        /**
         * 1:1 BATTLE
         */
        const battleRef = db.ref('battles');
        let battleRoomId   = null;  // 현재 참가 중인 방 ID
        let battleRole     = null;  // 'host' | 'guest'
        let battleMyName   = 'ME';
        let battleOppName  = '상대';
        let battleListener = null;
        let battleMode     = false;

        function genCode() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        function openBattleScreen() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('battle-screen').classList.remove('hidden');
            applyBattleLang();

            // 방 코드 생성 & Firebase에 등록
            const code = genCode();
            battleRoomId = code;
            battleRole   = 'host';
            battleRef.child(code).set({
                code,
                host:  { score: 0, done: false, name: '' },
                guest: { score: 0, done: false, name: '' },
                status: 'waiting',
                createdAt: Date.now()
            });

            document.getElementById('battle-room-code').innerText = code;

            // 게스트 참가 감지
            battleListener = battleRef.child(code + '/status').on('value', snap => {
                if (snap.val() === 'playing') startBattle();
            });
        }

        function joinBattleRoom() {
            const code = document.getElementById('battle-code-input').value.trim();
            if (code.length !== 4) return;
            battleRef.child(code).once('value').then(snap => {
                if (!snap.exists() || snap.val().status !== 'waiting') {
                    alert('방을 찾을 수 없습니다.');
                    return;
                }
                battleRoomId = code;
                battleRole   = 'guest';
                battleRef.child(code + '/guest/name').set('guest');
                // status를 playing으로 바꾼 후 게스트도 바로 startBattle
                battleRef.child(code + '/status').set('playing').then(() => {
                    startBattle();
                });
            });
        }

        function applyBattleLang() {
            const isKo = currentLang === 'ko';
            document.getElementById('battle-screen-title').innerText   = isKo ? '1:1 대전' : '1:1 バトル';
            document.getElementById('battle-waiting-text').innerText   = isKo ? '상대방을 기다리는 중...' : '相手を待っています...';
            document.getElementById('battle-cancel-btn').innerText     = isKo ? '취소' : 'キャンセル';
            document.getElementById('battle-join-btn').innerText       = isKo ? '참가' : '参加';
            document.getElementById('battle-exit-btn').innerText       = isKo ? '돌아가기' : '戻る';
        }

        let battleStarted = false;
        let battleOppScore = 0; // 상대 최종 점수 로컬 저장
        function startBattle() {
            if (battleStarted) return; // 중복 호출 방지
            battleStarted = true;

            // 호스트 리스너 정리
            if (battleListener) {
                battleRef.child(battleRoomId + '/status').off('value', battleListener);
                battleListener = null;
            }
            battleMode = true;

            // HUD 표시 (내부 요소 건드리지 않음)
            document.getElementById('battle-hud').style.display = 'flex';
            document.getElementById('hud-my-score').innerText = '0';
            document.getElementById('hud-opp-score').innerText = '0';

            // 모든 화면 숨기기
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.add('hidden');

            // 상대 점수 실시간 감시
            const oppRole = battleRole === 'host' ? 'guest' : 'host';
            battleRef.child(battleRoomId + '/' + oppRole + '/score').on('value', snap => {
                const v = snap.val();
                if (typeof v === 'number') {
                    battleOppScore = v;
                    document.getElementById('hud-opp-score').innerText = v;
                }
            });
            battleRef.child(battleRoomId + '/status').on('value', snap => {
                if (snap.val() === 'ended' && battleMode) {
                    battleMode = false;
                    gameState = 'GAMEOVER';
                    stopAllBgm();
                    // 내 최종 점수 저장 후 상대 점수 읽어서 결과 표시
                    const savedScore = score;
                    battleRef.child(battleRoomId + '/' + battleRole).update({ score: savedScore, done: true })
                        .then(() => {
                            // 상대 점수 직접 읽기
                            battleRef.child(battleRoomId + '/' + oppRole + '/score').once('value').then(s => {
                                const oppS = typeof s.val() === 'number' ? s.val() : battleOppScore;
                                showBattleResultDirect(savedScore, oppS);
                            }).catch(() => showBattleResultDirect(savedScore, battleOppScore));
                        })
                        .catch(() => showBattleResultDirect(savedScore, battleOppScore));
                }
            });

            startGame();
        }

        // 게임 중 내 점수를 Firebase에 계속 업데이트
        function battleSyncScore() {
            if (!battleMode || !battleRoomId) return;
            battleRef.child(battleRoomId + '/' + battleRole + '/score').set(score);
            document.getElementById('hud-my-score').innerText = score;
        }

        function battleGameOver() {
            if (!battleMode || !battleRoomId) return;
            battleMode = false;
            const savedScore = score;
            document.getElementById('hud-my-score').innerText = savedScore;
            // 내 점수 저장 → 종료 신호 → 결과 표시
            battleRef.child(battleRoomId + '/' + battleRole).update({ score: savedScore, done: true })
                .then(() => battleRef.child(battleRoomId + '/status').set('ended'))
                .then(() => showBattleResultDirect(savedScore, battleOppScore));
        }

        function showBattleResultDirect(myScore, oppScore) {
            document.getElementById('battle-hud').style.display = 'none';
            document.getElementById('game-over-screen').classList.add('hidden');

            const isKo = currentLang === 'ko';
            let resultText, resultClass;
            if      (myScore > oppScore)  { resultText = isKo ? '승리!' : 'WIN!';    resultClass = 'win';  }
            else if (myScore < oppScore)  { resultText = isKo ? '패배...' : 'LOSE';  resultClass = 'lose'; }
            else                          { resultText = isKo ? '무승부' : 'DRAW';   resultClass = 'draw'; }

            if (resultClass === 'win') playSfx('win', 1.0);
            else                       playSfx('gameover', 1.0);

            const titleEl = document.getElementById('battle-result-title');
            titleEl.innerText = resultText;
            titleEl.className = 'battle-result-title ' + resultClass;

            document.getElementById('bsc-me-name').innerText   = isKo ? '나' : '自分';
            document.getElementById('bsc-opp-name').innerText  = isKo ? '상대' : '相手';
            document.getElementById('bsc-me-score').innerText  = myScore;
            document.getElementById('bsc-opp-score').innerText = oppScore;

            document.getElementById('bsc-me').className  = 'battle-score-card' + (myScore  >= oppScore ? ' winner' : '');
            document.getElementById('bsc-opp').className = 'battle-score-card' + (oppScore >= myScore  ? ' winner' : '');

            document.getElementById('battle-result-screen').classList.remove('hidden');

            // 리매치 카운트다운 시작
            startRematchCountdown();
        }

        function showBattleResult(room) {
            const myRole  = battleRole;
            const oppRole = myRole === 'host' ? 'guest' : 'host';
            const myScore  = room[myRole] ? room[myRole].score : 0;
            const oppScore = room[oppRole] ? room[oppRole].score : 0;
            showBattleResultDirect(myScore, oppScore);
        }

        function cancelBattle() {
            if (battleRoomId) battleRef.child(battleRoomId).remove();
            battleRoomId  = null;
            battleRole    = null;
            battleMode    = false;
            battleStarted = false;
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
        }

        /**
         * REMATCH
         */
        let rematchTimer   = null;
        let rematchSeconds = 10;

        function startRematchCountdown() {
            rematchSeconds = 10;
            document.getElementById('rematch-countdown').innerText = rematchSeconds;
            document.getElementById('rematch-status').innerText = '';
            document.getElementById('battle-rematch-btn').disabled = false;

            rematchTimer = setInterval(() => {
                rematchSeconds--;
                document.getElementById('rematch-countdown').innerText = rematchSeconds;
                if (rematchSeconds <= 0) {
                    clearInterval(rematchTimer);
                    rematchTimer = null;
                    // 시간 초과 → 버튼 비활성화, 방 정리
                    document.getElementById('battle-rematch-btn').disabled = true;
                    document.getElementById('rematch-status').innerText =
                        currentLang === 'ko' ? '시간이 초과됐습니다.' : '時間切れです。';
                    if (battleRoomId) battleRef.child(battleRoomId + '/rematch').remove();
                }
            }, 1000);

            // 상대방 rematch 요청 감시
            battleRef.child(battleRoomId + '/rematch').on('value', snap => {
                const val = snap.val();
                if (!val) return;
                const oppRole = battleRole === 'host' ? 'guest' : 'host';
                const myReady  = val[battleRole]  === true;
                const oppReady = val[oppRole] === true;

                if (oppReady && !myReady) {
                    document.getElementById('rematch-status').innerText =
                        currentLang === 'ko' ? '상대방이 다시하기를 눌렀습니다!' : '相手がリマッチを要求しました！';
                }
                if (myReady && oppReady) {
                    clearInterval(rematchTimer);
                    rematchTimer = null;
                    battleRef.child(battleRoomId + '/rematch').off();
                    doRematch();
                }
            });
        }

        function requestRematch() {
            document.getElementById('battle-rematch-btn').disabled = true;
            document.getElementById('rematch-status').innerText =
                currentLang === 'ko' ? '상대방을 기다리는 중...' : '相手を待っています...';
            battleRef.child(battleRoomId + '/rematch/' + battleRole).set(true);
        }

        function doRematch() {
            document.getElementById('battle-result-screen').classList.add('hidden');
            // 상태 초기화 후 재경기
            battleStarted = false;
            battleMode    = false;
            battleOppScore = 0;
            // 방 리셋 (host가 처리)
            if (battleRole === 'host') {
                battleRef.child(battleRoomId).update({
                    host:   { score: 0, done: false, name: '' },
                    guest:  { score: 0, done: false, name: '' },
                    status: 'playing',
                    rematch: null
                });
            }
            startBattle();
        }

        function toggleIntroRanking() {
            const modal = document.getElementById('intro-ranking-modal');
            const isHidden = modal.classList.contains('hidden');
            if (isHidden) {
                modal.classList.remove('hidden');
                const list = document.getElementById('intro-rank-list');
                list.innerHTML = '<div style="color:#aaa;padding:20px;text-align:center;">불러오는 중...</div>';
                fetchRanks(ranks => {
                    if (ranks.length === 0) {
                        list.innerHTML = '<div style="color:#aaa;padding:20px;text-align:center;">아직 기록이 없습니다</div>';
                        return;
                    }
                    renderRankRows(list, ranks, null, null);
                });
            } else {
                modal.classList.add('hidden');
            }
        }

        function goToMain() {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('leaderboard-modal').classList.add('hidden');
            document.getElementById('ui-layer').classList.add('hidden');
            stopAllBgm();
            gameState = 'INTRO';
            document.getElementById('intro-screen').classList.remove('hidden');
            playTitleBgm();
        }

        function exitBattle() {
            if (rematchTimer) { clearInterval(rematchTimer); rematchTimer = null; }
            if (battleRoomId) {
                battleRef.child(battleRoomId + '/rematch').off();
                battleRef.child(battleRoomId).remove();
            }
            battleMode    = false;
            battleStarted = false;
            battleOppScore = 0;
            battleRoomId  = null;
            battleRole    = null;
            document.getElementById('battle-result-screen').classList.add('hidden');
            document.getElementById('battle-hud').style.display = 'none';
            stopAllBgm();
            gameState = 'INTRO';
            document.getElementById('intro-screen').classList.remove('hidden');
            playTitleBgm();
        }

    </script>

</body>

</html>
