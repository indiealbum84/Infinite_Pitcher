        const db = firebase.database();

        /**
         * INITIALIZATION
         */
        const BASE_W = 1080;
        const BASE_H = 1920;
        const LEGACY_BASE_W = 390;
        const FRAME_SCALE = BASE_W / LEGACY_BASE_W;

        function scalePx(value) {
            return value * FRAME_SCALE;
        }

        function getBlockSize() {
            return Math.min(width / 10, height / 10);
        }

        const BLOCK_Y_RATIO = 0.8;

        function getBlockHeight() {
            return getBlockSize() * BLOCK_Y_RATIO;
        }

        let viewportResizeRaf = 0;

        function getViewportRect() {
            const vv = window.visualViewport;
            return {
                width: vv ? vv.width : window.innerWidth,
                height: vv ? vv.height : window.innerHeight,
                offsetLeft: vv ? vv.offsetLeft : 0,
                offsetTop: vv ? vv.offsetTop : 0,
            };
        }

        function getSafeAreaInsets() {
            const probe = document.getElementById('safe-area-probe');
            if (!probe || typeof window.getComputedStyle !== 'function') {
                return { top: 0, right: 0, bottom: 0, left: 0 };
            }
            const cs = window.getComputedStyle(probe);
            return {
                top: Math.max(0, parseFloat(cs.top) || 0),
                right: Math.max(0, parseFloat(cs.right) || 0),
                bottom: Math.max(0, parseFloat(cs.bottom) || 0),
                left: Math.max(0, parseFloat(cs.left) || 0),
            };
        }

        function resize() {
            if (canvas.width !== BASE_W) canvas.width = BASE_W;
            if (canvas.height !== BASE_H) canvas.height = BASE_H;
            width = BASE_W;
            height = BASE_H;

            if (!Number.isFinite(player.x) || player.x <= 0) {
                player.x = width / 2;
            } else {
                player.x = Math.max(scalePx(8), Math.min(width - scalePx(8), player.x));
            }
            player.y = height - scalePx(105);

            const viewport = getViewportRect();
            const safe = getSafeAreaInsets();
            const availW = Math.max(1, viewport.width - safe.left - safe.right);
            const availH = Math.max(1, viewport.height - safe.top - safe.bottom);
            const scaleX = availW / BASE_W;
            const scaleY = availH / BASE_H;
            const scale = Math.min(scaleX, scaleY);
            const wrapper = document.getElementById('game-wrapper');
            wrapper.style.left = `${viewport.offsetLeft + safe.left + availW / 2}px`;
            wrapper.style.top = `${viewport.offsetTop + safe.top + availH / 2}px`;
            wrapper.style.transform = `translate(-50%, -50%) scale(${scale})`;
            wrapper.style.marginTop = '0';
        }

        function scheduleResize() {
            if (viewportResizeRaf) cancelAnimationFrame(viewportResizeRaf);
            viewportResizeRaf = requestAnimationFrame(() => {
                viewportResizeRaf = 0;
                resize();
            });
        }

        window.addEventListener('resize', scheduleResize);
        window.addEventListener('orientationchange', scheduleResize);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', scheduleResize);
            window.visualViewport.addEventListener('scroll', scheduleResize);
        }
        resize();


        /**
         * BLOCK MANAGEMENT
         */
        function createRow(startNum) {
            let row = [];
            let numbers = [];
            for (let i = 0; i < 10; i++) numbers.push(startNum + i);
            // Shuffle inside row
            numbers.sort(() => Math.random() - 0.5);

            const blockSize = getBlockSize();
            const blockHeight = getBlockHeight();
            for (let i = 0; i < 10; i++) {
                row.push({
                    x: i * blockSize,
                    y: 0,
                    num: numbers[i],
                    active: true,
                    size: blockSize,
                    height: blockHeight
                });
            }
            return row;
        }

        function initBlocks() {
            blocks = [];
            for (let r = 0; r < 10; r++) {
                let row = createRow(r * 10 + 1);
                row.forEach(b => b.y = (9 - r) * getBlockHeight()); // 역순 배치
                blocks.push(...row);
            }
        }

        /**
         * INPUT HANDLING
         */
        let isDragging = false;

        function handleStart(clientX) {
            if (testMode) return;
            if (gameState !== 'PLAYING' && gameState !== 'COUNTDOWN') return;
            isDragging = true;
            updatePlayerPosition(clientX);
        }

        function handleMove(clientX) {
            if (testMode) return;
            if (!isDragging) return;
            if (gameState !== 'PLAYING' && gameState !== 'COUNTDOWN') return;
            updatePlayerPosition(clientX);
        }

        function handleEnd() {
            isDragging = false;
        }

        function updatePlayerPosition(clientX) {
            const rect = canvas.getBoundingClientRect();
            const canvasX = ((clientX - rect.left) / rect.width) * width;
            player.x = Math.max(scalePx(8), Math.min(width - scalePx(8), canvasX));
        }

        // Mouse Events
        canvas.addEventListener('mousedown', (e) => {
            handleStart(e.clientX);
        });

        window.addEventListener('mousemove', (e) => {
            handleMove(e.clientX);
        });

        window.addEventListener('mouseup', () => {
            handleEnd();
        });

        // Touch Events — 터치 시 AudioContext resume (iOS 요구사항)
        canvas.addEventListener('touchstart', (e) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (e.touches.length > 0) {
                handleStart(e.touches[0].clientX);
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length > 0) {
                handleMove(e.touches[0].clientX);
                if (e.cancelable) e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('touchend', () => {
            handleEnd();
        });

        window.addEventListener('touchcancel', () => {
            handleEnd();
        });

        /**
         * GAME LOGIC
         */
        let continueUsed = false;
        let sessionPlayStartedAt = 0;
        let accumulatedPlayTimeMs = 0;

        function startCountdown(skipToNum) {
            gameState = 'COUNTDOWN';
            continueUsed = false;
            sessionPlayStartedAt = 0;
            accumulatedPlayTimeMs = 0;
            score = 0;
            nextExpectedNumber = 1;
            balls = [];
            scrollY = 0;
            targetScrollY = 0;
            destroyedNumbers = new Set();
            fireballCharging    = false;
            fireballActive      = false;
            fireballColumn      = -1;
            mirrorballActive    = false;
            mirrorballCharging  = false;
            mirrorballShotPending = false;
            mirrorballDoneCount = 0;
            mirrorWaveStart     = 0;
            stripeballActive    = false;
            stripeballCharging  = false;
            stripeballShotPending = false;
            stripeballTriggered = false;
            stripeWaveStart     = 0;
            flashballCharging   = false;
            flashballShotPending = false;
            flashballTriggered  = false;
            setPitcherThrowing(false);
            stopFlashball();
            initBlocks();
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('continue-screen').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('hidden');
            updateUI();

            const countdownScreen = document.getElementById('countdown-screen');
            const countdownText = document.getElementById('countdown-text');
            countdownScreen.classList.remove('hidden');

            // 안내 문구 표시 — 클릭/터치하면 카운트다운 시작
            countdownText.innerText = TEXTS[currentLang].instruction;
            countdownText.classList.add('countdown-instruction');
            countdownText.style.color = 'var(--palette-ink)';
            countdownText.style.textShadow = '';
            countdownText.style.fontSize = '';
            countdownText.style.whiteSpace = 'pre';

            let count = 3;
            fadeTitleBgm(5000);

            const startCountdownTick = () => {
                countdownText.classList.remove('countdown-instruction');
                countdownText.style.fontSize = '';
                countdownText.style.whiteSpace = '';
                countdownScreen.removeEventListener('click', startCountdownTick);
                countdownScreen.removeEventListener('touchstart', startCountdownTick);
                countdownScreen.style.pointerEvents = 'none';
                countdownScreen.dataset.waiting = 'false';

            const runTick = () => {
                if (count > 0) {
                    countdownText.innerText = count;
                    countdownText.style.color = 'var(--palette-blue)';
                    countdownText.style.textShadow = '4px 4px 0 #ffffff, 8px 8px 0 #000000, 0 0 16px rgba(64, 183, 242, 0.75)';

                    countdownText.classList.remove('countdown-animate');
                    void countdownText.offsetWidth;
                    countdownText.classList.add('countdown-animate');

                    playCountdownSfx();
                    count--;
                    setTimeout(runTick, 1000);
                } else if (count === 0) {
                    countdownText.innerText = 'START!';
                    countdownText.style.color = 'var(--palette-yellow)';
                    countdownText.style.textShadow = '4px 4px 0 #ffffff, 8px 8px 0 #000000, 0 0 16px rgba(255, 232, 92, 0.75)';

                    countdownText.classList.remove('countdown-animate');
                    void countdownText.offsetWidth;
                    countdownText.classList.add('countdown-animate');

                    // start.mp3 재생 → 끝나는 순간 bgm_game 시작
                    playSfx('start', 1.0, () => { playGameBgm(); });

                    count--;
                    setTimeout(runTick, 1000);
                } else {
                    countdownScreen.classList.add('hidden');
                    gameState = 'PLAYING';
                    sessionPlayStartedAt = performance.now();
                    lastPitchTime = performance.now();
                    if (TEST_MODE_ENABLED && skipToNum && skipToNum > 1) testSkipTo(skipToNum);
                }
            };

            runTick();
            requestAnimationFrame(gameLoop);
            };

            // 대전 모드에서는 안내 문구 없이 바로 카운트다운 시작
            if (battleMode) {
                startCountdownTick();
            } else {
                countdownScreen.dataset.waiting = 'true';
                countdownScreen.style.pointerEvents = 'auto';
                countdownScreen.addEventListener('click', startCountdownTick);
                countdownScreen.addEventListener('touchstart', startCountdownTick, { passive: true });
            }
        }



        function startGame() {
            startCountdown(TEST_MODE_ENABLED && testMode && testStartNum > 1 ? testStartNum : null);
        }

        function getTestStartScore(n, targetNumber) {
            if (n === 100) return 93;
            if (n === 200) return 174;
            if (n === 300) return 255;
            return targetNumber;
        }

        // 테스트용: 실제로 n번 직전까지 진행한 상태에서 시작
        function testSkipTo(n) {
            if (!TEST_MODE_ENABLED) return;
            if (gameState !== 'PLAYING') return;
            const targetNumber = n - 1;
            const testScore = getTestStartScore(n, targetNumber);
            const blockHeight = getBlockHeight();
            const rowsCleared = Math.floor(targetNumber / 10);
            const firstVisibleRowStart = rowsCleared * 10 + 1;

            // 상태 초기화 후 재구성
            balls = [];
            destroyedNumbers = new Set();
            for (let i = 1; i <= targetNumber; i++) destroyedNumbers.add(i);

            nextExpectedNumber = n;
            score = testScore;
            fireballCharging    = false;
            fireballActive      = false;
            fireballColumn      = -1;
            const mirrorballResolved = testScore > MIRRORBALL_TRIGGER_SCORE;
            mirrorballActive    = mirrorballResolved;
            mirrorballCharging  = false;
            mirrorballShotPending = false;
            mirrorballDoneCount = mirrorballResolved ? 1 : 0;
            mirrorWaveStart     = 0;
            stripeballActive    = n > STRIPEBALL_TRIGGER_NUMBER;
            stripeballCharging  = false;
            stripeballShotPending = false;
            stripeballTriggered = n > STRIPEBALL_TRIGGER_NUMBER;
            stripeWaveStart     = 0;
            flashballCharging   = false;
            flashballShotPending = false;
            setPitcherThrowing(false);
            stopFlashball();
            if (n > FLASHBALL_TRIGGER_NUMBER) {
                flashballTriggered = true;
                startFlashballBlink();
            } else {
                flashballTriggered = false;
            }

            // 실제로 target까지 진행한 것처럼 현재 줄부터 10줄을 배치한다.
            blocks = [];
            for (let r = 0; r < 10; r++) {
                const logicalRow = rowsCleared + r;
                const row = createRow(firstVisibleRowStart + r * 10);
                row.forEach(b => {
                    b.y = (9 - logicalRow) * blockHeight;
                    b.active = b.num > targetNumber;
                });
                blocks.push(...row);
            }

            targetScrollY = rowsCleared * blockHeight;
            scrollY = targetScrollY;

            updateUI();
            scheduleMirrorballIfNeeded();
            scheduleStripeballIfNeeded();
            scheduleFlashballIfNeeded();
        }

        function restoreBallStateBeforeContinue(failedBall) {
            if (failedBall && failedBall.isFireball) {
                fireballActive = false;
                fireballCharging = false;
            }
            if (failedBall && failedBall.isMirrorBall) {
                mirrorballCharging = false;
                mirrorballShotPending = true;
            }
            if (failedBall && failedBall.isStripeBall) {
                stripeballCharging = false;
                stripeballShotPending = true;
            }
            if (failedBall && failedBall.isFlashBall) {
                flashballCharging = false;
                flashballShotPending = true;
            }
            balls = [];
            setPitcherThrowing(false);
        }

        function pausePlayTimer() {
            if (sessionPlayStartedAt > 0) {
                accumulatedPlayTimeMs += Math.max(0, performance.now() - sessionPlayStartedAt);
                sessionPlayStartedAt = 0;
            }
        }

        function gameOver(failedBall = null) {
            setPitcherThrowing(false);
            pausePlayTimer();
            triggerHaptic('error');
            if (!battleMode && !continueUsed && score > 0) {
                gameState = 'CONTINUE';
                stopAllBgm();
                restoreBallStateBeforeContinue(failedBall);
                document.getElementById('continue-score-val').innerText = score;
                document.getElementById('continue-screen').classList.remove('hidden');
                return;
            }
            finalizeGameOver();
        }

        function finalizeGameOver() {
            pausePlayTimer();
            gameState = 'GAMEOVER';
            setPitcherThrowing(false);
            stopAllBgm();
            document.getElementById('continue-screen').classList.add('hidden');
            finalScoreEl.innerText = score;
            if (battleMode) {
                // 대전 모드: 효과음은 결과 화면에서 승패에 따라 재생
                battleGameOver();
            } else {
                playSfx('gameover', 1.0);
                document.getElementById('game-over-screen').classList.remove('hidden');
                evaluateScore(score);
            }
        }

        function skipContinue() {
            finalizeGameOver();
        }

        function watchAdToContinue() {
            if (gameState !== 'CONTINUE') return;
            // 추후 Capacitor AdMob 연동 시 window.showInfinitePitcherRewardedAd 훅이 있으면 우선 호출
            if (typeof window.showInfinitePitcherRewardedAd === 'function') {
                window.showInfinitePitcherRewardedAd(
                    () => resumeAfterContinue(),
                    () => {}
                );
                return;
            }

            // 웹/프리뷰용 3초 보상형 광고 시뮬레이션
            const overlay = document.getElementById('reward-ad-overlay');
            const timerEl = document.getElementById('reward-ad-timer');
            let rem = 3;
            timerEl.innerText = rem;
            overlay.classList.remove('hidden');

            const adTick = setInterval(() => {
                rem--;
                if (rem > 0) {
                    timerEl.innerText = rem;
                } else {
                    clearInterval(adTick);
                    overlay.classList.add('hidden');
                    resumeAfterContinue();
                }
            }, 1000);
        }

        function resumeAfterContinue() {
            continueUsed = true;
            document.getElementById('continue-screen').classList.add('hidden');
            gameState = 'COUNTDOWN';

            const countdownScreen = document.getElementById('countdown-screen');
            const countdownText = document.getElementById('countdown-text');
            countdownText.classList.remove('countdown-instruction');
            countdownText.style.fontSize = '';
            countdownText.style.whiteSpace = '';
            countdownScreen.style.pointerEvents = 'none';
            countdownScreen.dataset.waiting = 'false';
            countdownScreen.classList.remove('hidden');

            let count = 3;
            const runReviveTick = () => {
                if (count > 0) {
                    countdownText.innerText = count;
                    countdownText.style.color = 'var(--palette-blue)';
                    countdownText.style.textShadow = '4px 4px 0 #ffffff, 8px 8px 0 #000000, 0 0 16px rgba(64, 183, 242, 0.75)';
                    countdownText.classList.remove('countdown-animate');
                    void countdownText.offsetWidth;
                    countdownText.classList.add('countdown-animate');
                    playCountdownSfx();
                    count--;
                    setTimeout(runReviveTick, 1000);
                } else if (count === 0) {
                    countdownText.innerText = 'START!';
                    countdownText.style.color = 'var(--palette-yellow)';
                    countdownText.style.textShadow = '4px 4px 0 #ffffff, 8px 8px 0 #000000, 0 0 16px rgba(255, 232, 92, 0.75)';
                    countdownText.classList.remove('countdown-animate');
                    void countdownText.offsetWidth;
                    countdownText.classList.add('countdown-animate');
                    playSfx('start', 1.0, () => { playGameBgm(); });
                    count--;
                    setTimeout(runReviveTick, 1000);
                } else {
                    countdownScreen.classList.add('hidden');
                    gameState = 'PLAYING';
                    sessionPlayStartedAt = performance.now();
                    lastPitchTime = performance.now();
                }
            };

            runReviveTick();
            requestAnimationFrame(gameLoop);
        }

        function recoverTestPitch(ballIndex, ball) {
            if (!testMode) return false;

            if (ball && ball.isFireball) {
                fireballActive = false;
                fireballCharging = false;
            }
            if (ball && ball.isMirrorBall) {
                mirrorballCharging = false;
                mirrorballShotPending = true;
            }
            if (ball && ball.isStripeBall) {
                stripeballCharging = false;
                stripeballShotPending = true;
            }
            if (ball && ball.isFlashBall) {
                flashballCharging = false;
                flashballShotPending = true;
            }
            if (ballIndex >= 0 && balls[ballIndex] === ball) {
                balls.splice(ballIndex, 1);
            }
            setPitcherThrowing(false);
            lastPitchTime = performance.now() - getPitchInterval(nextExpectedNumber);
            updateUI();
            return true;
        }

        function updateUI() {
            scoreEl.innerText = score;
            if (battleMode) battleSyncScore();
        }

        function pitchBall(isFireball) {
            const isMirrorBall  = !isFireball && mirrorballShotPending;
            const isStripeBall  = !isFireball && !isMirrorBall && stripeballShotPending;
            const isFlashBall   = !isFireball && !isMirrorBall && !isStripeBall && flashballShotPending;
            if (isMirrorBall) {
                mirrorballShotPending = false;
                mirrorballCharging = true; // 미러볼이 맞고 웨이브가 끝날 때까지 다음 투구 차단
            }
            if (isStripeBall) {
                stripeballShotPending = false;
                stripeballCharging = true; // 스트라이프 웨이브가 끝날 때까지 다음 투구 차단
            }
            if (isFlashBall) {
                flashballShotPending = false;
            }
            balls.push({
                x: player.x,
                y: player.y - scalePx(20),
                radius: isFireball ? scalePx(14) : scalePx(8),
                speed: isFireball ? scalePx(12) : scalePx(10),
                isFireball: !!isFireball,
                isMirrorBall: isMirrorBall,
                isStripeBall: isStripeBall,
                isFlashBall: isFlashBall,
                activated: false,
                column: Math.floor(player.x / getBlockSize()),
                fireballStart: isFireball ? nextExpectedNumber : 0
            });
            setPitcherThrowing(true);
            if (isFireball) {
                playSfx('throw_fireball', 1.0);
            } else if (isMirrorBall) {
                playSfx('throw_mirrorball', 1.0);
            } else if (isStripeBall) {
                playSfx('throw_mirrorball', 1.0);
            } else if (isFlashBall) {
                playSfx('throw_mirrorball', 1.0);
            } else {
                playThrow();
            }
        }

        function mirrorDisplay(num) {
            if (mirrorballActive) {
                return String(num).split('').reverse().join('');
            }
            return String(num);
        }

        function triggerMirrorball() {
            mirrorballDoneCount++;
            playSfx('mirrorball', 1.0);
            triggerHaptic('medium');
            const mbAnnounce = document.getElementById('mirrorball-announce');
            mbAnnounce.classList.remove('show');
            void mbAnnounce.offsetWidth;
            mbAnnounce.classList.add('show');
        }

        function scheduleMirrorballIfNeeded() {
            const expectedMirrorCount = score >= MIRRORBALL_TRIGGER_SCORE ? 1 : 0;
            if (expectedMirrorCount <= mirrorballDoneCount || mirrorballCharging || mirrorballShotPending) return;

            mirrorballCharging = true;
            triggerMirrorball();
            setTimeout(() => {
                if (gameState !== 'PLAYING') return;
                mirrorballShotPending = true;
                mirrorballCharging = false;
                lastPitchTime = performance.now() - getPitchInterval(nextExpectedNumber);
            }, MIRRORBALL_ANNOUNCE_DURATION + MIRRORBALL_POST_ANNOUNCE_DELAY);
        }

        // 미러볼 공이 블록에 맞는 순간 호출 — 웨이브 시작
        function startMirrorWave() {
            mirrorWaveStart = performance.now();
            // 웨이브 2초 완료 후 반전 확정
            setTimeout(() => {
                mirrorWaveStart  = 0;
                mirrorballActive = true;
            }, MIRROR_WAVE_DURATION);
            // 웨이브 2초 + 대기 2초 후 투구 차단 해제 + 즉시 투구
            setTimeout(() => {
                mirrorballCharging = false;
                lastPitchTime = performance.now() - getPitchInterval(nextExpectedNumber);
            }, MIRROR_WAVE_DURATION + 2000);
        }

        function isStripeNormalRow(num) {
            const rowIndex = Math.floor((num - 1) / 10);
            if (rowIndex < STRIPEBALL_BASE_ROW_INDEX) return false;
            return (rowIndex - STRIPEBALL_BASE_ROW_INDEX) % 2 === 0;
        }

        function triggerStripeball() {
            stripeballTriggered = true;
            playSfx('stripeball', 1.0);
            triggerHaptic('medium');
            const sbAnnounce = document.getElementById('stripeball-announce');
            sbAnnounce.classList.remove('show');
            void sbAnnounce.offsetWidth;
            sbAnnounce.classList.add('show');
        }

        function scheduleStripeballIfNeeded() {
            if (nextExpectedNumber < STRIPEBALL_TRIGGER_NUMBER || stripeballTriggered || stripeballCharging || stripeballShotPending) return;

            stripeballCharging = true;
            triggerStripeball();
            setTimeout(() => {
                if (gameState !== 'PLAYING') return;
                stripeballShotPending = true;
                stripeballCharging = false;
                lastPitchTime = performance.now() - getPitchInterval(nextExpectedNumber);
            }, STRIPEBALL_ANNOUNCE_DURATION + STRIPEBALL_POST_ANNOUNCE_DELAY);
        }

        function startStripeWave() {
            stripeWaveStart = performance.now();
            setTimeout(() => {
                stripeWaveStart = 0;
                stripeballActive = true;
            }, MIRROR_WAVE_DURATION);
            setTimeout(() => {
                stripeballCharging = false;
                lastPitchTime = performance.now() - getPitchInterval(nextExpectedNumber);
            }, MIRROR_WAVE_DURATION + 2000);
        }

        function triggerFlashball() {
            flashballTriggered = true;
            playSfx('flashball', 1.0);
            triggerHaptic('medium');
            const fbAnnounce = document.getElementById('flashball-announce');
            fbAnnounce.classList.remove('show');
            void fbAnnounce.offsetWidth;
            fbAnnounce.classList.add('show');
        }

        function startFlashballBlink() {
            if (flashballTimer) { clearTimeout(flashballTimer); flashballTimer = null; }
            flashballActive  = true;
            flashballVisible = true;
            // 0.4초 보임 -> 0.4초 숨김 루프
            function tick() {
                if (!flashballActive) return;
                flashballVisible = true;
                flashballTimer = setTimeout(() => {
                    if (!flashballActive) return;
                    flashballVisible = false;
                    flashballTimer = setTimeout(tick, 400);
                }, 400);
            }
            tick();
        }

        function startFlashballRevealDelay() {
            flashballCharging = true;
            startFlashballBlink();
            setTimeout(() => {
                if (gameState !== 'PLAYING') return;
                flashballCharging = false;
                lastPitchTime = performance.now() - getPitchInterval(nextExpectedNumber);
            }, MIRROR_WAVE_DURATION + 2000);
        }

        function scheduleFlashballIfNeeded() {
            if (nextExpectedNumber < FLASHBALL_TRIGGER_NUMBER || flashballTriggered || flashballCharging || flashballShotPending) return;

            flashballCharging = true;
            triggerFlashball();
            setTimeout(() => {
                if (gameState !== 'PLAYING') return;
                flashballShotPending = true;
                flashballCharging = false;
                lastPitchTime = performance.now() - getPitchInterval(nextExpectedNumber);
            }, FLASHBALL_SHOT_DELAY);
        }

        function stopFlashball() {
            flashballActive  = false;
            flashballVisible = true;
            if (flashballTimer) { clearTimeout(flashballTimer); flashballTimer = null; }
        }

        // nextExpectedNumber를 올릴 때 파괴된 번호 건너뜀 + 특수볼 노티 발동
        function advanceExpected() {
            nextExpectedNumber++;
            while (destroyedNumbers.has(nextExpectedNumber)) {
                nextExpectedNumber++;
            }
            scheduleMirrorballIfNeeded();
            scheduleStripeballIfNeeded();
            scheduleFlashballIfNeeded();
        }

        let isPageInactive = false;

        function update(timestamp) {
            if (gameState !== 'PLAYING' || isPageInactive || document.visibilityState === 'hidden') return;

            // 테스트 모드: nextExpectedNumber 블록 위치로 자동 이동
            if (testMode) {
                const targetBlk = blocks.find(b => b.active && b.num === nextExpectedNumber);
                if (targetBlk) {
                    const targetX = targetBlk.x + targetBlk.size / 2;
                    const diff = targetX - player.x;
                    player.x += diff * getTestMoveFactor(nextExpectedNumber); // 투구 속도에 맞춰 자동 이동
                    player.x = Math.max(scalePx(8), Math.min(width - scalePx(8), player.x));
                }
            }

            // Auto Pitching — 차징 중이거나 파이어볼 비행 중이면 투구 차단
            const currentPitchInterval = getPitchInterval(nextExpectedNumber);
            if (!fireballCharging && !fireballActive && !mirrorballCharging && !stripeballCharging && !flashballCharging && timestamp - lastPitchTime > currentPitchInterval) {
                lastPitchTime = timestamp;

                // 31, 131, 231... → 파이어볼
                const isFireballTurn = (nextExpectedNumber - 31) % 100 === 0 && nextExpectedNumber >= 31;

                if (isFireballTurn) {
                    fireballCharging = true;
                    fireballColumn   = Math.floor(player.x / getBlockSize());
                    playSfx('fireball', 1.0);
                    triggerHaptic('medium');
                    const fbAnnounce = document.getElementById('fireball-announce');
                    fbAnnounce.classList.remove('show');
                    void fbAnnounce.offsetWidth;
                    fbAnnounce.classList.add('show');
                    setTimeout(() => {
                        if (gameState !== 'PLAYING') return;
                        fireballCharging = false;
                        fireballColumn   = -1;
                        fireballActive   = true;
                        pitchBall(true);
                    }, 2200);
                } else {
                    pitchBall(false);
                }
            }

            // Update Balls
            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                b.y -= b.speed;

                if (b.isFireball) {
                    // 파이어볼: 같은 열에서 공이 닿은 블록 처리
                    // 파괴 범위: 해당 사이클 끝까지 (31번→1~130, 131번→131~230...)
                    const fbCycleEnd = b.fireballStart + 99; // fireballStart = 파이어볼 발사 시점 nextExpectedNumber
                    let spliced = false;
                    for (let j = 0; j < blocks.length; j++) {
                        let blk = blocks[j];
                        if (!blk.active) continue;
                        let blkCol = Math.floor(blk.x / getBlockSize());
                        if (blkCol !== b.column) continue;
                        let blkY = blk.y + scrollY;
                        if (!(b.y < blkY + blk.height && b.y > blkY - b.radius)) continue;

                        if (!b.activated) {
                            if (blk.num !== nextExpectedNumber) {
                                if (recoverTestPitch(i, b)) {
                                    spliced = true;
                                    break;
                                }
                                setPitcherThrowing(false);
                                gameOver(b);
                                spliced = true;
                                break;
                            }
                            b.activated = true;
                            blk.active = false;
                            setPitcherThrowing(false);
                            score++;
                            playSfx('throw_hit', 1.0);
                            triggerHaptic('heavy');
                            advanceExpected();
                            updateUI();
                            checkRowClear(); // 맞춘 블록(31번)에서만 1번 스크롤 체크
                        } else {
                            // 사이클 범위 내 블록만 파괴 — score에 포함 안 함
                            if (blk.num <= fbCycleEnd) {
                                blk.active = false;
                                destroyedNumbers.add(blk.num);
                                playSfx('throw_hit', 0.5);
                                triggerHaptic('light');
                            }
                        }
                    }
                    // nextExpectedNumber가 파괴된 번호면 건너뜀
                    while (destroyedNumbers.has(nextExpectedNumber)) {
                        nextExpectedNumber++;
                    }
                    if (!spliced) updateUI();
                    if (!spliced && b.y < -scalePx(20)) {
                        balls.splice(i, 1);
                        fireballActive = false;
                        setPitcherThrowing(false);
                        if (!b.activated) {
                            if (recoverTestPitch(-1, b)) return;
                            gameOver(b);
                            return;
                        }
                        lastPitchTime = performance.now();
                    }
                } else {
                    // 일반 공: 겹침 면적이 가장 넓은 블록으로 판정
                    let bestBlk = null;
                    let bestArea = 0;
                    for (let j = 0; j < blocks.length; j++) {
                        let blk = blocks[j];
                        if (!blk.active) continue;
                        let blkY = blk.y + scrollY;
                        const overlapX = Math.min(b.x + b.radius, blk.x + blk.size) - Math.max(b.x - b.radius, blk.x);
                        const overlapY = Math.min(b.y + b.radius, blkY + blk.height) - Math.max(b.y - b.radius, blkY);
                        if (overlapX > 0 && overlapY > 0) {
                            const area = overlapX * overlapY;
                            if (area > bestArea) { bestArea = area; bestBlk = blk; }
                        }
                    }
                    if (bestBlk) {
                        if (bestBlk.num === nextExpectedNumber) {
                            bestBlk.active = false;
                            setPitcherThrowing(false);
                            score++;
                            const wasMirrorBall = b.isMirrorBall;
                            const wasStripeBall = b.isStripeBall;
                            const wasFlashBall = b.isFlashBall;
                            advanceExpected();
                            balls.splice(i, 1);
                            playSfx('throw_hit', 1.0);
                            triggerHaptic(wasMirrorBall || wasStripeBall || wasFlashBall ? 'heavy' : 'light');
                            updateUI();
                            checkRowClear();
                            if (wasMirrorBall) {
                                mirrorballCharging = true; // 웨이브+대기 동안 다시 차단
                                startMirrorWave();
                            } else if (wasStripeBall) {
                                stripeballCharging = true; // 웨이브+대기 동안 다시 차단
                                startStripeWave();
                            } else if (wasFlashBall) {
                                startFlashballRevealDelay();
                            }
                        } else {
                            if (recoverTestPitch(i, b)) continue;
                            setPitcherThrowing(false);
                            gameOver(b);
                            return;
                        }
                    } else if (b.y < -scalePx(20)) {
                        if (b.isMirrorBall) {
                            mirrorballCharging = false;
                            lastPitchTime = performance.now();
                        }
                        if (b.isStripeBall) {
                            stripeballCharging = false;
                            lastPitchTime = performance.now();
                        }
                        balls.splice(i, 1);
                        setPitcherThrowing(false);
                        if (recoverTestPitch(-1, b)) continue;
                        gameOver(b);
                        return;
                    }
                }
            }

            // Smooth Scrolling
            if (scrollY < targetScrollY) {
                scrollY = Math.min(scrollY + scalePx(2), targetScrollY);
            }
        }

        function checkRowClear() {
            const targetRowsCleared = Math.floor(score / 10);
            const blockHeight = getBlockHeight();
            const currentRowsCleared = Math.round(targetScrollY / blockHeight);

            if (targetRowsCleared > currentRowsCleared) {
                targetScrollY = targetRowsCleared * blockHeight;
                const maxNum = Math.max(...blocks.map(b => b.num));
                let newRow = createRow(maxNum + 1);
                const topMostY = Math.min(...blocks.map(b => b.y));
                newRow.forEach(b => b.y = topMostY - blockHeight);
                blocks.push(...newRow);
            }
        }

        const blockTileCache = new Map();
        function getBlockTileCanvas(blockSize, blockHeight, isGuide) {
            const key = `${Math.round(blockSize * 10)}:${Math.round(blockHeight * 10)}:${isGuide ? 'guide' : 'normal'}`;
            if (blockTileCache.has(key)) return blockTileCache.get(key);

            const tileCanvas = document.createElement('canvas');
            tileCanvas.width = blockSize;
            tileCanvas.height = blockHeight;

            const tileCtx = tileCanvas.getContext('2d');
            const tileInset = scalePx(2.5);
            const tileW = blockSize - tileInset * 2;
            const tileH = blockHeight - tileInset * 2;
            tileCtx.fillStyle = isGuide ? varColor('--palette-yellow') : '#fffaf0';
            tileCtx.strokeStyle = isGuide ? '#ff5a91' : 'rgba(53, 201, 143, 0.95)';
            tileCtx.lineWidth = isGuide ? scalePx(2.6) : scalePx(2);
            tileCtx.beginPath();
            tileCtx.roundRect(tileInset, tileInset, tileW, tileH, scalePx(5));
            tileCtx.fill();
            tileCtx.stroke();

            blockTileCache.set(key, tileCanvas);
            return tileCanvas;
        }

        /**
         * RENDERING
         */
        function draw() {
            ctx.clearRect(0, 0, width, height);

            // 잔디 배경 — 짝수/홀수 줄을 교차해 자연스러운 잔디 줄무늬 연출
            const stripeW = getBlockSize();
            const stripeColors = ['#a8de8f', '#82c864'];
            for (let i = 0; i < 10; i++) {
                ctx.fillStyle = stripeColors[i % 2];
                ctx.fillRect(i * stripeW, 0, stripeW, height);
            }

            // 잔디 질감 — 세로 방향 미세 하이라이트
            for (let i = 0; i < 10; i++) {
                const gx = i * stripeW;
                const grad = ctx.createLinearGradient(gx, 0, gx + stripeW, 0);
                grad.addColorStop(0,   'rgba(255,255,255,0.04)');
                grad.addColorStop(0.5, 'rgba(255,255,255,0.10)');
                grad.addColorStop(1,   'rgba(255,255,255,0.04)');
                ctx.fillStyle = grad;
                ctx.fillRect(gx, 0, stripeW, height);
            }

            // 흰색 세로 라인
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = scalePx(1);
            for (let i = 1; i < 10; i++) {
                ctx.beginPath();
                ctx.moveTo(i * stripeW, 0);
                ctx.lineTo(i * stripeW, height);
                ctx.stroke();
            }

            // 파이어볼 차징 중: 해당 열 강조
            if (fireballCharging && fireballColumn >= 0) {
                ctx.fillStyle = 'rgba(255, 120, 0, 0.25)';
                ctx.fillRect(fireballColumn * stripeW, 0, stripeW, height);
            }

            // Draw pitch guide line
            ctx.save();
            ctx.setLineDash([scalePx(6), scalePx(8)]);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.lineWidth = scalePx(1.5);
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - scalePx(20));
            ctx.lineTo(player.x, 0);
            ctx.stroke();
            ctx.restore();

            const mirrorGuideActive = mirrorballShotPending || balls.some(b => b.isMirrorBall && !b.activated);
            const stripeGuideActive = stripeballShotPending || balls.some(b => b.isStripeBall && !b.activated);
            const flashGuideActive  = flashballShotPending || balls.some(b => b.isFlashBall && !b.activated);

            let waveMinY = 0;
            let waveRange = 1;
            let mirrorWaveProgress = 0;
            let stripeWaveProgress = 0;
            if (mirrorWaveStart > 0 || stripeWaveStart > 0) {
                const activeBlocks = blocks.filter(b => b.active);
                const now = performance.now();
                if (activeBlocks.length) {
                    const activeYs = activeBlocks.map(b => b.y + scrollY);
                    waveMinY = Math.min(...activeYs);
                    const waveMaxY = Math.max(...activeYs);
                    waveRange = waveMaxY - waveMinY || 1;
                }
                if (mirrorWaveStart > 0) {
                    mirrorWaveProgress = Math.min((now - mirrorWaveStart) / MIRROR_WAVE_DURATION, 1);
                }
                if (stripeWaveStart > 0) {
                    stripeWaveProgress = Math.min((now - stripeWaveStart) / MIRROR_WAVE_DURATION, 1);
                }
            }

            // Draw Blocks
            blocks.forEach(blk => {
                if (!blk.active) return;
                let drawY = blk.y + scrollY;
                if (drawY > height || drawY < -blk.height) return;

                const isNext = blk.num === nextExpectedNumber;
                const isFireballNext = (nextExpectedNumber - 31) % 100 === 0 && nextExpectedNumber >= 31;
                const isGuide = isNext && (nextExpectedNumber === 1 || isFireballNext || mirrorGuideActive || stripeGuideActive || flashGuideActive);
                ctx.drawImage(getBlockTileCanvas(blk.size, blk.height, isGuide), blk.x, drawY, blk.size, blk.height);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const tx = blk.x + blk.size / 2;
                const ty = drawY + blk.height / 2;

                // 웨이브 중: 아래 행부터 위로 순차 적용
                let mirrorWaveFlipped = false;
                let stripeWaveApplied = false;
                if (mirrorWaveStart > 0 || stripeWaveStart > 0) {
                    // 아래 행(drawY 큼)일수록 rowNorm 큰 값 → progress가 작아도 먼저 뒤집힘
                    const rowNorm = (drawY - waveMinY) / waveRange; // 0(위)~1(아래)
                    if (mirrorWaveStart > 0) {
                        mirrorWaveFlipped = (1 - rowNorm) <= mirrorWaveProgress; // 아래부터 뒤집힘
                    }
                    if (stripeWaveStart > 0) {
                        stripeWaveApplied = (1 - rowNorm) <= stripeWaveProgress; // 아래부터 스트라이프 적용
                    }
                }
                let isReversed = mirrorballActive || mirrorWaveFlipped;
                if ((stripeballActive || stripeWaveApplied) && isStripeNormalRow(blk.num)) {
                    isReversed = false;
                }
                const label = isReversed ? String(blk.num).split('').reverse().join('') : String(blk.num);

                const showLabel = !flashballActive || flashballVisible || isGuide;
                if (showLabel) {
                    const numberFontSize = Math.round(scalePx(label.length >= 4 ? 12 : label.length >= 3 ? 14 : 16));
                    ctx.font = `900 ${numberFontSize}px "Darumadrop One", "Kosugi Maru", "Noto Sans JP", Arial`;
                    ctx.fillStyle = isGuide ? '#ff4f8f' : '#000000';
                    ctx.fillText(label, tx, ty);
                }
            });

            // Draw Balls
            balls.forEach(b => {
                if (b.isFireball) {
                    // 불꽃 외곽 글로우
                    const glowGrad = ctx.createRadialGradient(b.x, b.y, b.radius * 0.5, b.x, b.y, b.radius * 3.5);
                    glowGrad.addColorStop(0,   'rgba(255, 220, 50, 0.9)');
                    glowGrad.addColorStop(0.4, 'rgba(255, 100, 0, 0.6)');
                    glowGrad.addColorStop(1,   'rgba(255, 30, 0, 0)');
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius * 3.5, 0, Math.PI * 2);
                    ctx.fillStyle = glowGrad;
                    ctx.fill();

                    // 불꽃 튀기 파티클 (고정 시드 패턴)
                    const spikes = 8;
                    for (let s = 0; s < spikes; s++) {
                        const angle  = (s / spikes) * Math.PI * 2 + performance.now() * 0.005;
                        const len    = b.radius * (2.2 + Math.sin(performance.now() * 0.02 + s) * 0.8);
                        ctx.beginPath();
                        ctx.moveTo(b.x, b.y);
                        ctx.lineTo(b.x + Math.cos(angle) * len, b.y + Math.sin(angle) * len);
                        ctx.strokeStyle = `rgba(255, ${100 + s * 15}, 0, 0.8)`;
                        ctx.lineWidth = scalePx(3);
                        ctx.stroke();
                    }

                    // 파이어볼 본체
                    const fbGrad = ctx.createRadialGradient(b.x - b.radius * 0.3, b.y - b.radius * 0.3, scalePx(1), b.x, b.y, b.radius);
                    fbGrad.addColorStop(0,   '#fff7a0');
                    fbGrad.addColorStop(0.4, '#ff9900');
                    fbGrad.addColorStop(1,   '#cc2200');
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = fbGrad;
                    ctx.fill();
                } else if (b.isStripeBall) {
                    // 스트라이프볼 — 줄무늬 야구공
                    const r = b.radius;
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    ctx.rotate(performance.now() * 0.008);

                    const stripeGrad = ctx.createRadialGradient(-r * 0.35, -r * 0.35, scalePx(1), 0, 0, r);
                    stripeGrad.addColorStop(0, '#ffffff');
                    stripeGrad.addColorStop(0.55, '#f6f8ff');
                    stripeGrad.addColorStop(1, '#b8c6d8');
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.fillStyle = stripeGrad;
                    ctx.fill();
                    ctx.clip();

                    ctx.lineWidth = r * 0.35;
                    ctx.strokeStyle = '#111827';
                    for (let sx = -r * 2; sx <= r * 2; sx += r * 0.75) {
                        ctx.beginPath();
                        ctx.moveTo(sx, -r * 1.8);
                        ctx.lineTo(sx + r * 1.2, r * 1.8);
                        ctx.stroke();
                    }

                    ctx.restore();
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ccff00';
                    ctx.lineWidth = scalePx(1.5);
                    ctx.stroke();
                } else if (b.isFlashBall) {
                    // 301번 공 — 번쩍이는 플래시볼
                    const r = b.radius;
                    const t = performance.now() * 0.01;
                    const spikes = 8;
                    for (let s = 0; s < spikes; s++) {
                        const angle = (s / spikes) * Math.PI * 2 + t;
                        const len   = r * (2.0 + Math.sin(t * 2 + s) * 0.5);
                        ctx.beginPath();
                        ctx.moveTo(b.x, b.y);
                        ctx.lineTo(b.x + Math.cos(angle) * len, b.y + Math.sin(angle) * len);
                        ctx.strokeStyle = `rgba(255, 255, ${100 + s * 20}, 0.9)`;
                        ctx.lineWidth = scalePx(2.5);
                        ctx.stroke();
                    }
                    const flGrad = ctx.createRadialGradient(b.x - r * 0.3, b.y - r * 0.3, scalePx(1), b.x, b.y, r);
                    flGrad.addColorStop(0,   '#ffffff');
                    flGrad.addColorStop(0.4, '#ffffaa');
                    flGrad.addColorStop(1,   '#ffcc00');
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
                    ctx.fillStyle = flGrad;
                    ctx.fill();
                    ctx.strokeStyle = '#ffee00';
                    ctx.lineWidth = scalePx(1.5);
                    ctx.stroke();
                } else if (b.isMirrorBall) {
                    // 101번 공 — 손거울 모양
                    const r = b.radius;
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    // 거울 원형 부분
                    const mirGrad = ctx.createRadialGradient(-r*0.3, -r*0.3, scalePx(1), 0, 0, r);
                    mirGrad.addColorStop(0, '#ffffff');
                    mirGrad.addColorStop(0.4, '#c8e8ff');
                    mirGrad.addColorStop(1, '#7ab8d8');
                    ctx.beginPath();
                    ctx.arc(0, -r * 0.3, r, 0, Math.PI * 2);
                    ctx.fillStyle = mirGrad;
                    ctx.fill();
                    ctx.strokeStyle = '#888888';
                    ctx.lineWidth = scalePx(1.5);
                    ctx.stroke();
                    // 반짝임
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.beginPath();
                    ctx.arc(-r * 0.35, -r * 0.6, r * 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    // 손잡이
                    ctx.beginPath();
                    ctx.roundRect(-r * 0.25, r * 0.6, r * 0.5, r * 0.9, r * 0.15);
                    ctx.fillStyle = '#a0785a';
                    ctx.fill();
                    ctx.strokeStyle = '#7a5a3a';
                    ctx.lineWidth = scalePx(1.2);
                    ctx.stroke();
                    ctx.restore();
                } else {
                    // 일반 야구공
                    const r = b.radius;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = scalePx(1.8);
                    ctx.stroke();

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, r * 0.92, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.strokeStyle = '#ff3b30';
                    ctx.lineWidth = scalePx(1.2);
                    ctx.lineCap = 'round';
                    const seamEdgeX = r * 0.54;
                    const seamInnerX = r * 0.18;
                    const seamTopY = r * 0.74;
                    ctx.beginPath();
                    ctx.moveTo(b.x - seamEdgeX, b.y - seamTopY);
                    ctx.quadraticCurveTo(b.x - seamInnerX, b.y, b.x - seamEdgeX, b.y + seamTopY);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(b.x + seamEdgeX, b.y - seamTopY);
                    ctx.quadraticCurveTo(b.x + seamInnerX, b.y, b.x + seamEdgeX, b.y + seamTopY);
                    ctx.stroke();
                    ctx.restore();

                    ctx.beginPath();
                    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = scalePx(1.8);
                    ctx.stroke();
                }
            });

            // Draw Player & Cart
            drawPlayer();
        }

        function drawPlayer() {
            const px = player.x;
            const py = player.y;

            // cart.png — 아래쪽 (크기 축소)
            const cartW = Math.min(width * 0.13, scalePx(65));
            const cartH = cartImg.naturalHeight ? (cartW * cartImg.naturalHeight / cartImg.naturalWidth) : scalePx(40);
            ctx.drawImage(cartImg, px - cartW / 2, py + scalePx(40), cartW, cartH);

            // pitcher.png / pitcher_throw.png — 투구 상태에 따라 교체
            const activePitcherImg = pitcherThrowing && pitcherThrowImg.naturalWidth ? pitcherThrowImg : pitcherImg;
            const pitcherW = Math.min(width * 0.16, scalePx(80));
            const pitcherH = activePitcherImg.naturalHeight ? (pitcherW * activePitcherImg.naturalHeight / activePitcherImg.naturalWidth) : scalePx(100);
            ctx.drawImage(activePitcherImg, px - pitcherW / 2, py - pitcherH - cartH + scalePx(120), pitcherW, pitcherH);
        }

        function varColor(name) {

        function gameLoop(timestamp) {

        /**
         * LEADERBOARD — Firebase Realtime Database (Global TOP 1000 & Country TOP 1000 + Anti-Cheat)
         */
        let pendingScore = null;
        const LEADERBOARD_LIMIT = 1000;
        const CACHE_KEY_GLOBAL = 'infinitePitcherRanksCacheV4_global';
        const CACHE_KEY_COUNTRY_PREFIX = 'infinitePitcherRanksCacheV4_country_';
        const PLAYER_NAME_KEY = 'infinitePitcherPlayerName';
        const USER_COUNTRY_KEY = 'infinitePitcherUserCountry';
        const ranksRef = db.ref('ranks');
        const countryRanksRootRef = db.ref('ranks_country');
        let currentLeaderboardScope = 'global'; // 'global' | 'country'
        let lastHighlightName = null;
        let lastHighlightScore = null;

        function inferCountryFromLocaleAndTz() {
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
                const tzMap = {
                    'Asia/Seoul': 'KR',
                    'Asia/Tokyo': 'JP',
                    'Asia/Taipei': 'TW',
                    'Asia/Hong_Kong': 'HK',
                    'Asia/Singapore': 'SG',
                    'Asia/Bangkok': 'TH',
                    'Asia/Jakarta': 'ID',
                    'Asia/Manila': 'PH',
                    'Asia/Ho_Chi_Minh': 'VN',
                    'Asia/Saigon': 'VN',
                    'Asia/Shanghai': 'CN',
                    'Europe/London': 'GB',
                    'Europe/Paris': 'FR',
                    'Europe/Berlin': 'DE',
                    'Australia/Sydney': 'AU',
                };
                if (tzMap[tz]) return tzMap[tz];
                if (tz.startsWith('America/')) return 'US';
            } catch (e) {}

            try {
                const loc = (navigator.language || navigator.userLanguage || '').toUpperCase();
                const parts = loc.split(/[-_]/);
                if (parts.length > 1 && /^[A-Z]{2}$/.test(parts[1])) return parts[1];
                if (parts[0] === 'KO') return 'KR';
                if (parts[0] === 'JA') return 'JP';
                if (parts[0] === 'EN') return 'US';
            } catch (e) {}
            return 'KR';
        }

        let userCountry = (() => {
            try {
                const saved = localStorage.getItem(USER_COUNTRY_KEY);
                if (saved && /^[A-Z]{2}$/.test(saved)) return saved;
            } catch (e) {}
            return inferCountryFromLocaleAndTz();
        })();

        function countryToFlag(code) {
            const cc = String(code || '').toUpperCase();
            if (!/^[A-Z]{2}$/.test(cc)) return '🌍';
            return String.fromCodePoint(
                0x1F1E6 + (cc.charCodeAt(0) - 65),
                0x1F1E6 + (cc.charCodeAt(1) - 65)
            );
        }

        function updateCountryTabLabels() {
            const flag = countryToFlag(userCountry);
            const label = `${flag} ${userCountry} TOP 1000`;
            const globalLabel = '🌍 GLOBAL';
            const introGlobal = document.getElementById('intro-tab-global');
            const introCountry = document.getElementById('intro-tab-country');
            const resGlobal = document.getElementById('result-tab-global');
            const resCountry = document.getElementById('result-tab-country');

            if (introGlobal) {
                introGlobal.innerText = globalLabel;
                introGlobal.classList.toggle('active', currentLeaderboardScope === 'global');
            }
            if (introCountry) {
                introCountry.innerText = label;
                introCountry.classList.toggle('active', currentLeaderboardScope === 'country');
            }
            if (resGlobal) {
                resGlobal.innerText = globalLabel;
                resGlobal.classList.toggle('active', currentLeaderboardScope === 'global');
            }

                resCountry.classList.toggle('active', currentLeaderboardScope === 'country');

        // 접속 국가 IP 기반 자동 감지 (실패/오프라인 시 타임존/로케일 국가 코드 유지)
        (function detectUserCountryByIp() {
            updateCountryTabLabels();
            fetch('https://api.country.is/', { cache: 'no-store' })
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    const cc = String(data?.country || '').toUpperCase();
                    if (/^[A-Z]{2}$/.test(cc)) {
                        userCountry = cc;
                        try { localStorage.setItem(USER_COUNTRY_KEY, cc); } catch (e) {}

        function switchLeaderboardScope(scope) {
            if (scope !== 'global' && scope !== 'country') return;
            currentLeaderboardScope = scope;
            updateCountryTabLabels();
            if (isVisibleScreen('game-over-screen')) {
                renderRankList(lastHighlightName, lastHighlightScore);

        function getCachedRanks(scope = currentLeaderboardScope) {
            const key = scope === 'country' ? (CACHE_KEY_COUNTRY_PREFIX + userCountry) : CACHE_KEY_GLOBAL;
            try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { return []; }
        }

        function setCachedRanks(ranks, scope = currentLeaderboardScope) {
            const key = scope === 'country' ? (CACHE_KEY_COUNTRY_PREFIX + userCountry) : CACHE_KEY_GLOBAL;
            try { localStorage.setItem(key, JSON.stringify(ranks)); } catch(e) {}
        }

        function getSavedPlayerName() {
            try { return localStorage.getItem(PLAYER_NAME_KEY) || ''; } catch(e) { return ''; }
        }

        function setSavedPlayerName(name) {
            try { localStorage.setItem(PLAYER_NAME_KEY, name); } catch(e) {}
        }

        function normalizeRankEntry(entry) {
            const rawName = String(entry?.name || entry?.email || 'NO NAME').trim();
            const rawCountry = String(entry?.country || '').toUpperCase();
            return {
                name: (rawName.replace(/@.*/, '') || 'NO NAME').slice(0, 12),
                score: Number(entry?.score) || 0,
                country: /^[A-Z]{2}$/.test(rawCountry) ? rawCountry : '',
                date: entry?.date || '',
                createdAt: Number(entry?.createdAt) || 0,
            };
        }

        function buildAntiCheatToken(scoreVal, playTimeMsVal, nextExpectedVal, countryCode) {
            // 클라이언트 서명 토큰 (콘솔 단순 조작 방지용)
            const raw = `${scoreVal}:${Math.floor(playTimeMsVal / 100)}:${nextExpectedVal}:${countryCode}:IP_V1`;
            let hash = 2166136261;
            for (let i = 0; i < raw.length; i++) {
                hash ^= raw.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            return (hash >>> 0).toString(16);
        }

        function fetchRanksByScope(scope, callback) {
            const cached = getCachedRanks(scope);
            const targetRef = scope === 'country'
                ? countryRanksRootRef.child(userCountry)
                : ranksRef;

            targetRef.orderByChild('score').limitToLast(LEADERBOARD_LIMIT).once('value')
                .then(snap => {
                    const val = snap.val() || {};
                    const rows = Object.values(val)
                        .map(normalizeRankEntry)
                        .filter(r => r.score > 0 && r.score <= 3000)
                        .sort((a, b) => b.score - a.score || (a.createdAt - b.createdAt))
                        .slice(0, LEADERBOARD_LIMIT);
                    setCachedRanks(rows, scope);
                    callback(rows, { ok: true });
                })
                .catch(err => {
                    console.warn('[Leaderboard] Firebase fetch fallback to cache:', err);
                    callback(cached, { ok: false, reason: 'firebase-error' });
                });
        }

        function fetchRanks(callback) {
            fetchRanksByScope(currentLeaderboardScope, callback);
        }

        function calcProvisionalRank(ranks, newScore) {
            let higherCount = 0;
            for (let i = 0; i < ranks.length; i++) {
                if (Number(ranks[i].score) > newScore) higherCount++;
            }
            return higherCount + 1;
        }

        function evaluateScore(newScore) {
            const normalizedScore = Number(newScore) || 0;
            lastHighlightName = null;
            lastHighlightScore = null;
            updateCountryTabLabels();

            document.dispatchEvent(new CustomEvent('game:end', {
                detail: { score: normalizedScore },
                bubbles: true,
                composed: true,
            }));

            const rankEntryEl = document.getElementById('rank-entry');
            const registerBtnEl = document.getElementById('register-btn');
            const modalEl = document.getElementById('leaderboard-modal');
            const badgeEl = document.getElementById('my-rank-badge');
            const nameInputEl = document.getElementById('player-name-input');
            const rankDetailEl = document.getElementById('my-rank-detail');

            if (badgeEl) badgeEl.style.display = 'none';
            if (rankDetailEl) rankDetailEl.innerText = '';

            if (normalizedScore <= 0) {
                pendingScore = null;
                rankEntryEl.classList.add('hidden');
                registerBtnEl.classList.add('hidden');
                modalEl.classList.remove('hidden');
                renderRankList(null, null);
                return;
            }

            // 글로벌 TOP 1000 및 접속 국가 TOP 1000 동시 확인
            fetchRanksByScope('global', (globalRanks) => {
                fetchRanksByScope('country', (countryRanks) => {
                    const globalRank = calcProvisionalRank(globalRanks, normalizedScore);
                    const countryRank = calcProvisionalRank(countryRanks, normalizedScore);
                    const inGlobalTop = globalRank <= LEADERBOARD_LIMIT;
                    const inCountryTop = countryRank <= LEADERBOARD_LIMIT;

                    if (inGlobalTop || inCountryTop) {
                        pendingScore = normalizedScore;
                        const primaryRank = inGlobalTop ? globalRank : countryRank;
                        document.getElementById('my-rank-val').innerText = primaryRank;
                        document.getElementById('rank-suffix').innerText = textFor('rankSuffix');
                        if (rankDetailEl) {
                            const flag = countryToFlag(userCountry);
                            const globalTxt = inGlobalTop ? `#${globalRank}` : '1000+';
                            const countryTxt = inCountryTop ? `#${countryRank}` : '1000+';
                            rankDetailEl.innerText = `🌍 GLOBAL ${globalTxt}  |  ${flag} ${userCountry} ${countryTxt}`;
                        }
                        if (nameInputEl) {
                            nameInputEl.value = getSavedPlayerName();
                            setTimeout(() => nameInputEl.focus(), 80);
                        }
                        rankEntryEl.classList.remove('hidden');
                        registerBtnEl.classList.remove('hidden');
                        modalEl.classList.add('hidden');
                    } else {
                        pendingScore = null;
                        rankEntryEl.classList.add('hidden');
                        registerBtnEl.classList.add('hidden');
                        modalEl.classList.remove('hidden');
                        renderRankList(null, null);
                    }
                });
            });
        }

        function registerName() {
            if (pendingScore == null) return;
            const scoreToSave = Number(pendingScore) || 0;
            const nameInputEl = document.getElementById('player-name-input');
            const rawName = (nameInputEl ? nameInputEl.value : '').trim();
            const playerName = (rawName || 'PLAYER').slice(0, 12);

            if (rawName) setSavedPlayerName(playerName);
            pendingScore = null;
            lastHighlightName = playerName;
            lastHighlightScore = scoreToSave;

            document.getElementById('rank-entry').classList.add('hidden');
            document.getElementById('register-btn').classList.add('hidden');
            document.getElementById('leaderboard-modal').classList.remove('hidden');

            // 실제 플레이 시간 검증값 (최소 투구 간격 450ms/점 이상 보장)
            const playTimeMs = Math.max(Math.round(accumulatedPlayTimeMs), scoreToSave * 450);
            const expectedNum = Math.max(nextExpectedNumber, scoreToSave + 1);
            const newEntry = {
                name: playerName,
                score: scoreToSave,
                country: userCountry,
                playTimeMs: playTimeMs,
                nextExpected: expectedNum,
                sig: buildAntiCheatToken(scoreToSave, playTimeMs, expectedNum, userCountry),
                date: new Date().toISOString().slice(0, 10),
                createdAt: Date.now()
            };

            // 로컬 캐시(글로벌 & 국가별)에 즉시 반영하여 UI 지연 방지
            ['global', 'country'].forEach(scope => {
                const updated = [...getCachedRanks(scope), newEntry]
                    .sort((a, b) => b.score - a.score || ((a.createdAt || 0) - (b.createdAt || 0)))
                    .slice(0, LEADERBOARD_LIMIT);
                setCachedRanks(updated, scope);
            });

            renderRankRows(document.getElementById('rank-list'), getCachedRanks(currentLeaderboardScope), playerName, scoreToSave);

            Promise.all([
                ranksRef.push(newEntry),
                countryRanksRootRef.child(userCountry).push(newEntry)
            ]).then(() => {
                renderRankList(playerName, scoreToSave);
            }).catch(err => {
                console.warn('[Leaderboard] Firebase save failed, kept in local cache:', err);
            });
        }

        function renderRankList(highlightName, highlightScore = null) {
            const list = document.getElementById('rank-list');
            enableResultRankTouchScroll(list);
            updateCountryTabLabels();
            const cached = getCachedRanks(currentLeaderboardScope);
            if (cached.length > 0) renderRankRows(list, cached, highlightName, highlightScore);
            else list.innerHTML = `<div style="color:#aaa;padding:20px;">${textFor('loadingRanks')}</div>`;

            fetchRanks((ranks) => {
                if (ranks.length === 0) {
                    list.innerHTML = `<div style="color:#aaa;padding:20px;">${textFor('emptyRanks')}</div>`;
                    return;
                }
                renderRankRows(list, ranks, highlightName, highlightScore);
            });
        }

        function enableResultRankTouchScroll(list) {
            if (list._touchBound) return;
            list._touchBound = true;
            let startY = 0;
            let startScroll = 0;

            list.addEventListener('touchstart', event => {
                if (event.touches.length === 0) return;
                startY = event.touches[0].clientY;
                startScroll = list.scrollTop;
            }, { passive: true });

            list.addEventListener('touchmove', event => {
                if (event.touches.length === 0) return;
                list.scrollTop = startScroll + startY - event.touches[0].clientY;
                event.stopPropagation();
            }, { passive: true });
        }

        function renderRankRows(list, ranks, highlightName, highlightScore) {
            const badge = document.getElementById('my-rank-badge');
            const rows = Array.isArray(ranks) ? ranks.slice(0, LEADERBOARD_LIMIT) : [];

            // 공동순위 계산: 앞 항목과 점수 같으면 같은 순위
            const displayRanks = [];
            let currentRank = 1;
            rows.forEach((r, i) => {
                if (i > 0 && r.score === rows[i - 1].score) {
                    displayRanks.push(displayRanks[i - 1]);
                } else {
                    currentRank = i + 1;
                    displayRanks.push(currentRank);
                }
            });

            let myRankIdx = -1;
            if (highlightName) {
                myRankIdx = rows.findIndex(r =>
                    r.name === highlightName && (highlightScore === null || r.score === highlightScore)
                );
            }

            if (myRankIdx >= 0 && badge && list.id === 'rank-list') {
                badge.style.display = 'block';
                const scopeIcon = currentLeaderboardScope === 'country' ? countryToFlag(userCountry) : '🏆';
                badge.innerHTML = `${scopeIcon} <span class="rank-badge-number">${displayRanks[myRankIdx]}</span>${textFor('rankSuffix')}`;
            } else if (badge && list.id === 'rank-list') {
                badge.style.display = 'none';
            }

            list.innerHTML = rows.map((r, i) => {
                const isMe = i === myRankIdx;
                const safeName = String(r.name || 'NO NAME').replace(/[&<>"']/g, ch => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                }[ch]));
                const flagPrefix = r.country ? `${countryToFlag(r.country)} ` : '';
                return `<div class="rank-item${isMe ? ' is-me' : ''}">
                    <span class="rank-num">#${displayRanks[i]}</span>
                    <span class="rank-name">${flagPrefix}${safeName}</span>
                    <span class="rank-score">${r.score} PTS</span>
                </div>`;
            }).join('');

            // 내 순위로 자동 스크롤
            if (myRankIdx >= 0) {
                setTimeout(() => {
                    const items = list.querySelectorAll('.rank-item');
                    if (items[myRankIdx]) items[myRankIdx].scrollIntoView({ block: 'center', behavior: 'smooth' });
                }, 100);
            }
        }

        function toggleLeaderboard(forceOpen = false) {

        // 탭 숨김 / 앱 백그라운드 / 창 포커스 이탈 시 오디오 및 타이머 정지·복귀

        const BATTLE_NAME_STORAGE_KEY = 'infinitePitcherBattleName';
        const BATTLE_NAME_MAX_WEIGHT = 10;

        function genCode() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        function genBattlePlayerId() {
            return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
        }

        function escapeBattleText(value) {
            return String(value).replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function getBattleNameWeight(char) {
            return /^[\x20-\x7E]$/.test(char) ? 1 : 2;
        }

        function clampBattleName(value) {
            const cleaned = String(value || '').replace(/[\r\n\t]/g, ' ').replace(/\s{2,}/g, ' ');
            let next = '';
            let weight = 0;
            for (const char of cleaned) {
                const charWeight = getBattleNameWeight(char);
                if (weight + charWeight > BATTLE_NAME_MAX_WEIGHT) break;
                next += char;
                weight += charWeight;
            }
            return next;
        }

        function getBattleNickname() {
            const input = document.getElementById('battle-name-input');
            return clampBattleName(input ? input.value : '').trim();
        }

        function getSavedBattleNickname() {
            try {
                return clampBattleName(localStorage.getItem(BATTLE_NAME_STORAGE_KEY) || '').trim();
            } catch(e) {
                return '';
            }
        }

        function saveBattleNickname(name) {
            try { localStorage.setItem(BATTLE_NAME_STORAGE_KEY, name); } catch(e) {}
        }

        function hydrateBattleNameInput() {
            const input = document.getElementById('battle-name-input');

        function commitBattleNickname() {

        function getBattlePlayerList(room = null) {
            const players = room && room.players ? room.players : battlePlayers;

                id,

            })).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));

        function getBattlePlayerLabel(player, index) {

        function clearBattleResultListener(roomId = battleRoomId) {
            if (!battleResultListener || !roomId) return;
            battleRef.child(roomId).off('value', battleResultListener);
