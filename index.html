<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./pitcher.png">
    <title>無限投手: 世界一への道</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@700;900&family=Gamja+Flower&family=Darumadrop+One&family=Fredoka:wght@600;700&family=Orbitron:wght@700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-neon: #ccff00;
            --bg-dark: #0f172a;
            --block-bg: #1e293b;
            --text-white: #f8fafc;
            --palette-mint: #35c98f;
            --palette-blue: #40b7f2;
            --palette-pink: #f59bd4;
            --palette-yellow: #ffe85c;
            --palette-purple: #8d72f6;
            --palette-ink: #111827;
            --palette-cream: #fff7d8;
            --palette-soft-mint: #d8f8df;
            --palette-soft-blue: #d7f3ff;
            --palette-soft-pink: #ffd8ef;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
        }

        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            font-family: 'Darumadrop One', 'Kosugi Maru', 'Noto Sans JP', sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            color: #0f172a;
            height: 100%;
            min-height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #safe-area-probe {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            right: env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            left: env(safe-area-inset-left, 0px);
            pointer-events: none;
            visibility: hidden;
            z-index: -1;
        }

        #game-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 1080px;
            height: 1920px;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            transform-origin: center center;
            will-change: transform;
        }

        /* --- Screens --- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
            padding: 20px;
            text-align: center;
        }

        .hidden {
            display: none !important;
            opacity: 0;
        }

        /* Splash Screen */
        #splash-screen {
            background-color: #ffffff;
            background-image: url('./splash.png');
            background-size: cover;
            background-position: center;
            z-index: 20;
            gap: 0;
            cursor: pointer;
            touch-action: auto !important;
        }

        #splash-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.7);
            z-index: 0;
        }

        #splash-screen > * {
            position: relative;
            z-index: 1;
        }


        .splash-title-art {
            width: min(760px, 116%);
            height: auto;
            display: block;
            margin: 0 auto 60px;
            transform: translateX(-32px);
            pointer-events: none;
        }

        .splash-touch-hint {
            font-size: 18px;
            font-weight: 700;
            color: #475569;
            letter-spacing: 0.5px;
            animation: blink 1.4s ease-in-out infinite;
        }

        .splash-start-btn {
            background: transparent;
            color: var(--palette-ink);
            border: 0;
            cursor: pointer;
            box-shadow: none;
            font-family: 'Darumadrop One', 'Kosugi Maru', 'Noto Sans JP', cursive;
            font-size: 32px;
            letter-spacing: 1px;
            padding: 0;
            text-shadow: 2px 2px 0 #ffffff;
            touch-action: auto !important;
            transition: transform 0.1s;
        }

        .splash-start-btn:active {
            transform: scale(0.96);
        }

        .lang-switcher {
            position: absolute;
            top: 16px;
            left: 12px;
            display: flex;
            gap: 5px;
            z-index: 3;
        }

        .lang-switch-btn {
            background: #ffffff;
            color: var(--palette-ink);
            border: 2px solid #000000;
            border-radius: 10px;
            box-shadow: 0 3px 0 var(--palette-blue), 0 3px 0 1px #000000;
            cursor: pointer;
            font-family: 'Darumadrop One', 'Kosugi Maru', 'Noto Sans JP', sans-serif;
            font-size: 10px;
            font-weight: 900;
            min-width: 48px;
            padding: 6px 7px;
            touch-action: auto !important;
        }

        .lang-switch-btn.active {
            background: var(--palette-yellow);
            box-shadow: 0 3px 0 var(--palette-pink), 0 3px 0 1px #000000;
        }

        .lang-switch-btn[data-lang="ja"] {
            font-family: 'Zen Maru Gothic', 'Kosugi Maru', 'Noto Sans JP', sans-serif;
            font-weight: 900;
            -webkit-text-stroke: 0.45px currentColor;
        }

        .lang-switch-btn[data-lang="en"] {
            font-family: 'Darumadrop One', 'Kosugi Maru', 'Noto Sans JP', sans-serif;
            font-weight: 900;
            -webkit-text-stroke: 0;
        }

        .lang-switch-btn[data-lang="ko"] {
            font-family: 'Gamja Flower', 'Noto Sans JP', sans-serif;
            font-weight: 900;
            -webkit-text-stroke: 0.45px currentColor;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.25; }
        }

        /* Intro Screen */
        #intro-screen {
            background: #b9ecff url('./main_background.png') center -40px / cover no-repeat;
            justify-content: flex-start;
            align-items: center;
            overflow: hidden;
            padding: 0;
            touch-action: auto !important;
        }

        .title-art {
            position: absolute;
            top: 58px;
            left: 50%;
            width: min(760px, 116%);
            height: auto;
            display: block;
            margin: 0;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 1;
        }

        /* Speech Bubble */
        .speech-bubble {
            position: absolute;
            top: 270px;
            left: 50%;
            background: var(--palette-yellow);
            border: 3px solid #000000;
            border-radius: 20px;
            padding: 15px 18px;
            color: var(--palette-ink);
            font-weight: 900;
            font-size: 16px;
            width: max-content;
            max-width: calc(100% - 14px);
            margin: 0;
            transform: translateX(-50%);
            box-shadow: 0 6px 0 var(--palette-pink), 0 8px 0 2px #000000;
            line-height: 1.5;
            z-index: 2;
        }

        .speech-bubble .bubble-nowrap {
            white-space: nowrap;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: var(--palette-yellow) transparent;
            display: block;
            width: 0;
            z-index: 1;
            transform: translateX(-50%);
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            border-width: 20px 20px 0;
            border-style: solid;
            border-color: #000000 transparent;
            display: block;
            width: 0;
            z-index: 0;
            transform: translateX(-50%);
        }

        .start-btn {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 12px 50px;
            font-size: 24px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-neon), 0 6px 0 2px #000000;
            transition: transform 0.1s, box-shadow 0.1s;
            font-family: 'Darumadrop One', 'Kosugi Maru', 'Noto Sans JP', sans-serif;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .intro-menu {
            position: absolute;
            left: 50%;
            bottom: 72px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 0;
            transform: translateX(-50%);
            z-index: 2;
        }

        .intro-main-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #intro-screen .intro-main-actions .start-btn {
            width: 142px;
            min-height: 50px;
            padding: 8px 12px;
            margin-top: 0;
            font-size: 24px;
            line-height: 1.1;
            white-space: nowrap;
        }

        #intro-screen #start-btn-id {
            background-color: var(--palette-mint);
            color: #ffffff;
            border-color: #000000;
            box-shadow: 0 6px 0 var(--palette-pink), 0 6px 0 2px #000000;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.18);
        }

        #intro-screen #battle-btn {
            background-color: var(--palette-blue);
            color: #ffffff;
            border-color: #000000;
            box-shadow: 0 6px 0 var(--palette-pink), 0 6px 0 2px #000000;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.18);
        }

        html[lang="ja"] #intro-screen #battle-btn {
            font-size: 19px;
        }

        html[lang="ja"] body,
        html[lang="ja"] .start-btn,
        html[lang="ja"] #rank-suffix,
        html[lang="ja"] .name-input,
        html[lang="ja"] .battle-title,
        html[lang="ja"] .battle-result-title,
        html[lang="ja"] .battle-hud-box span,
        html[lang="ja"] .test-sel-btn {
            font-family: 'Zen Maru Gothic', 'Kosugi Maru', 'Noto Sans JP', sans-serif;
            font-weight: 900;
            -webkit-text-stroke: 0.45px currentColor;
        }

        html[lang="ko"] body,
        html[lang="ko"] .start-btn,
        html[lang="ko"] #rank-suffix,
        html[lang="ko"] .name-input,
        html[lang="ko"] .battle-title,
        html[lang="ko"] .battle-result-title,
        html[lang="ko"] .battle-hud-box span,
        html[lang="ko"] .test-sel-btn {
            font-family: 'Gamja Flower', 'Noto Sans JP', sans-serif;
            font-weight: 900;
            -webkit-text-stroke: 0.45px currentColor;
        }

        html[lang="ja"] #countdown-text.countdown-instruction {
            font-family: 'Zen Maru Gothic', 'Kosugi Maru', 'Noto Sans JP', sans-serif;
            font-weight: 900;
            -webkit-text-stroke: 0;
        }

        html[lang="ko"] #countdown-text.countdown-instruction {
            font-family: 'Gamja Flower', 'Noto Sans JP', sans-serif;
            font-weight: 900;
            -webkit-text-stroke: 0;
        }

        html[lang="ja"] .game-over-title,
        html[lang="ko"] .game-over-title,
        html[lang="ja"] .final-score,
        html[lang="ko"] .final-score {
            font-family: 'Darumadrop One', 'Kosugi Maru', 'Noto Sans JP', cursive;
            font-weight: 900;
            -webkit-text-stroke: 0;
        }

        #intro-screen #start-btn-id:active {
            box-shadow: 0 2px 0 var(--palette-pink), 0 2px 0 2px #000000;
        }

        #intro-screen #battle-btn:active {
            box-shadow: 0 2px 0 var(--palette-pink), 0 2px 0 2px #000000;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-neon), 0 2px 0 2px #000000;
        }

        /* Game UI */
        #ui-layer {
            position: absolute;
            top: 56px;
            left: 56px;
            right: 56px;
            display: flex;
            justify-content: flex-end;
            z-index: 5;
            pointer-events: none;
        }

        .stat-box {
            background: linear-gradient(180deg, #fffdf2 0%, var(--palette-cream) 100%);
            padding: 17px 44px;
            border-radius: 39px;
            border: 8px solid #000000;
            box-shadow: 0 14px 0 var(--palette-pink), 0 14px 0 6px #000000;
        }

        .stat-label {
            font-family: 'Darumadrop One', 'Kosugi Maru', 'Noto Sans JP', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #5f6472;
            display: block;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 66px;
            font-weight: 900;
            font-family: 'Fredoka', 'Kosugi Maru', 'Noto Sans JP', sans-serif;
            color: var(--palette-blue);
            text-shadow: 6px 6px 0 #ffffff;
            letter-spacing: 5px;
        }

        #score {
            display: block;
            text-align: right;
        }

        /* Game Over Screen */
        #game-over-screen {
            background: linear-gradient(rgba(185, 236, 255, 0.88), rgba(255, 247, 216, 0.92)), url('./main_background.png') center top / cover no-repeat;
            justify-content: flex-start;
            overflow-y: auto;
            padding-top: 30px;
            padding-bottom: 30px;
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch;
        }

        .game-over-title {
            font-family: 'Darumadrop One', 'Kosugi Maru', 'Noto Sans JP', cursive;
            font-size: 56px;
            color: #ff5a91;
            margin: 0;
            white-space: nowrap;
            text-shadow: 4px 4px 0 #ffe85c, 7px 7px 0 #000000;
        }

        .final-score {
            font-size: 42px;
            margin: 10px 0;
            color: var(--palette-ink);
            background: var(--palette-yellow);
            border: 3px solid #000000;
            border-radius: 18px;
            padding: 4px 22px;
            box-shadow: 0 6px 0 var(--palette-pink), 0 6px 0 2px #000000;
        }

        #final-score-val {
            font-family: 'Fredoka', 'Kosugi Maru', 'Noto Sans JP', sans-serif;
            font-weight: 900;
        }

        .leaderboard-btn {
            background: #ffffff;
            color: var(--palette-ink);
            border: 3px solid #000000;
            margin-top: 15px;
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 900;
            box-shadow: 0 4px 0 var(--palette-blue), 0 4px 0 2px #000000;
        }

        /* Result Leaderboard */
        #leaderboard-modal {
            background: var(--palette-cream);
            border: 3px solid #000000;
            padding: 20px;
            border-radius: 20px;
            width: 90%;
            max-height: 300px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-top: 20px;
            box-shadow: 0 8px 0 var(--palette-pink), 0 8px 0 2px #000000;
        }

        #rank-list {
            flex: 1 1 auto;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-y !important;
        }

        #rank-list,
        #rank-list * {
            touch-action: pan-y !important;
        }

        .leaderboard-login-prompt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 18px 10px;
            color: var(--palette-ink);
            text-align: center;
        }

        .leaderboard-login-prompt p {
            margin: 0;
            line-height: 1.45;
        }

        .leaderboard-login-help {
            color: #6b7280;
            font-size: 13px;
        }

        .leaderboard-login-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 4px;
        }

        .leaderboard-login-btn {
            border: 3px solid #000000;
            border-radius: 14px;
            padding: 10px 18px;
            background: var(--palette-yellow);
            color: var(--palette-ink);
            box-shadow: 0 4px 0 var(--palette-pink);
            font-family: inherit;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
        }

        .leaderboard-login-btn.retry {
            background: #ffffff;
            box-shadow: 0 4px 0 var(--palette-blue);
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 6px;
            border-bottom: 2px solid rgba(64, 183, 242, 0.35);
            border-radius: 8px;
            color: var(--palette-ink);
        }

        .rank-item.is-me {
            background: var(--palette-soft-pink);
            border: 2px solid #000000;
            box-shadow: 0 3px 0 var(--palette-yellow);
        }

        .rank-item.is-me .rank-num,
        .rank-item.is-me .rank-name {
            color: var(--palette-ink);
            font-weight: 900;
        }

        #my-rank-badge {
            display: none;
            background: var(--palette-cream);
            color: #000;
            font-family: 'Darumadrop One', 'Kosugi Maru', 'Noto Sans JP', sans-serif;
            font-weight: 900;
            font-size: 16px;
            border-radius: 20px;
            padding: 6px 20px;
            margin-bottom: 8px;
        }

        .rank-badge-number {
            color: var(--palette-yellow);
            font-size: 22px;
            text-shadow: 2px 2px 0 #ff5a91, 4px 4px 0 #000000;
        }

        .rank-num {
            font-weight: 900;
            color: var(--palette-pink);
            width: 40px;
        }

        .rank-score {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 13px;
            color: var(--palette-blue);
            letter-spacing: 0.5px;
        }

        .rank-name {
            flex: 1;
            color: var(--palette-ink);
            text-align: left;
            padding-left: 10px;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }

        /* Name Entry */
        #rank-entry {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }

        .rank-announce {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            font-family: 'Fredoka', 'Kosugi Maru', 'Noto Sans JP', sans-serif;
            font-size: 30px;
            font-weight: 900;
            color: #ff5a91;
            margin: 0 0 14px;
            padding-left: 52px;
            text-shadow: none;
        }

        .rank-announce span {
            font-family: inherit;
            font-size: 42px;
        }

        #my-rank-val {
            color: #000000;
            display: inline-block;
            font-size: 54px;
            line-height: 0.9;
            text-shadow: none;
        }

        #rank-suffix {
            color: #ff5a91;
            font-family: 'Darumadrop One', 'Kosugi Maru', 'Noto Sans JP', sans-serif;
            font-size: 21px;
            line-height: 1.1;
            text-shadow: none;
        }

        .name-input {
            background: #ffffff;
            border: 3px solid #000000;
            border-radius: 14px;
            color: var(--palette-ink);
            font-size: 20px;
            font-weight: 700;
            padding: 10px 20px;
            text-align: center;
            width: 240px;
            margin-bottom: 14px;
            font-family: 'Darumadrop One', 'Kosugi Maru', 'Noto Sans JP', sans-serif;
            outline: none;
            box-shadow: 0 4px 0 var(--palette-mint), 0 4px 0 2px #000000;
            -webkit-user-select: text !important;
            user-select: text !important;
            touch-action: auto !important;
            -webkit-touch-callout: default !important;
            pointer-events: auto !important;
        }

        .name-input::placeholder {
            color: #8c8f98;
            font-size: 14px;
        }

        #game-over-screen .start-btn {
            background: var(--palette-mint);
            color: #ffffff;
            border-color: #000000;
            box-shadow: 0 6px 0 var(--palette-pink), 0 6px 0 2px #000000;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.18);
        }

        #action-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #game-over-footer {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: auto;
        }

        /* input 태그에 전역 touch/select 제한 해제 */
        input {
            -webkit-user-select: text !important;
            user-select: text !important;
            touch-action: auto !important;
        }

        /* Fireball 알림 오버레이 */
        #fireball-announce {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 30;
            opacity: 0;
        }

        #fireball-announce.show {
            animation: fbAnnounce 1.2s ease-out forwards;
        }

        @keyframes fbAnnounce {
            0%   { opacity: 0; transform: scale(0.4); }
            20%  { opacity: 1; transform: scale(1.15); }
            50%  { opacity: 1; transform: scale(1.0); }
            80%  { opacity: 1; transform: scale(1.0); }
            100% { opacity: 0; transform: scale(0.9); }
        }

        #fireball-announce-img {
            width: 120%;
            height: 120%;
            object-fit: contain;
            transform: translateX(-3%);
        }

        /* Flashball 알림 오버레이 */
        #flashball-announce {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 30;
            opacity: 0;
        }

        #flashball-announce.show {
            animation: fbAnnounce 1.8s ease-out forwards;
        }

        #flashball-announce-img {
            width: 120%;
            height: 120%;
            object-fit: contain;
            transform: translateX(-3%);
        }

        /* Stripeball 알림 오버레이 */

        .battle-hud-box {

            border-top: 0;

        .battle-scores {

        .battle-score-card {
            border-width: 6px;
            border-radius: 22px;
            padding: 28px 33px;
            min-width: 199px;
            box-shadow: 0 11px 0 var(--palette-blue);
        }

            box-shadow: 0 11px 0 var(--palette-pink), 0 11px 0 6px #000000;

        #battle-rematch-btn {
            margin-bottom: 22px !important;
        }

        #rematch-status {
            font-size: 36px !important;
            margin: 0 0 22px !important;
            min-height: 50px !important;
        }

        /* Countdown Screen */
        #countdown-screen {
            background-color: rgba(255, 247, 216, 0.45);
            backdrop-filter: blur(4px);
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #countdown-text {
            font-family: 'Darumadrop One', 'Kosugi Maru', 'Noto Sans JP', cursive;
            font-size: 210px;
            font-weight: 900;
            -webkit-text-stroke: 2px currentColor;
            color: var(--palette-blue);
            text-shadow: 11px 11px 0 #ffffff, 22px 22px 0 #000000;
            transition: transform 0.1s ease-out;
            transform: scale(1);
        }

        #countdown-text.countdown-instruction {
            font-family: 'Darumadrop One', 'Kosugi Maru', 'Noto Sans JP', sans-serif;
            background: #ffffff;
            border: 8px solid #000000;
            border-radius: 50px;
            color: var(--palette-ink);
            font-size: 36px;
            font-weight: 900;
            line-height: 1.55;
            max-width: calc(100% - 130px);
            padding: 40px 52px;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            -webkit-text-stroke: 0;
            text-shadow: none;
            box-shadow: 0 17px 0 var(--palette-pink), 0 17px 0 6px #000000;
        }

        .countdown-animate {
            animation: popIn 0.8s ease-out forwards;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
            100% {
                transform: scale(1.0);
                opacity: 1;
            }
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Continue (Rewarded Ad Revive) Screen */
        #continue-screen {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(8px);
            z-index: 22;
            gap: 28px;
        }

        .continue-card {
            background: var(--palette-cream);
            border: 8px solid #000000;
            border-radius: 55px;
            padding: 64px 52px;
            width: min(860px, calc(100% - 80px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            box-shadow: 0 22px 0 var(--palette-pink), 0 22px 0 6px #000000;
        }

        .continue-title {
            font-family: 'Darumadrop One', 'Kosugi Maru', 'Noto Sans JP', cursive;
            font-size: 110px;
            color: var(--palette-blue);
            margin: 0;
            line-height: 1;
            text-shadow: 6px 6px 0 #ffffff, 11px 11px 0 #000000;
        }

        .continue-desc {
            font-size: 40px;
            font-weight: 900;
            color: var(--palette-ink);
            margin: 0;
            line-height: 1.45;
            white-space: pre-line;
        }

        .continue-ad-btn {
            background: var(--palette-yellow) !important;
            color: var(--palette-ink) !important;
            width: 100%;
            padding: 28px 36px !important;
            font-size: 48px !important;
            border-radius: 34px !important;
            margin-top: 8px !important;
            box-shadow: 0 14px 0 var(--palette-pink), 0 14px 0 6px #000000 !important;
            text-shadow: none !important;
        }

        .continue-skip-btn {
            background: #ffffff;
            color: #64748b;
            border: 6px solid #000000;
            border-radius: 50px;
            padding: 16px 52px;
            font-size: 34px;
            font-weight: 900;
            cursor: pointer;
            font-family: inherit;

            font-family: 'Fredoka', sans-serif;
            font-size: 96px;
            font-weight: 900;
            color: var(--palette-mint);
        }
    </style>
</head>

        <!-- 파이어볼 알림 오버레이 -->

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        /**
         * IMAGES
         */
        const cartImg = new Image();
        cartImg.src = './cart.png';

        const pitcherImg = new Image();
        pitcherImg.src = './pitcher.png';

        const pitcherThrowImg = new Image();
        pitcherThrowImg.src = './pitcher_throw.png';

        let pitcherThrowing = false;

        function setPitcherThrowing(isThrowing) {
            pitcherThrowing = isThrowing;
        }


        /**
         * AUDIO SYSTEM
         */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let gameBgmBuffer = null;
        let gameBgmSource = null;
        const GAME_BGM_VOLUME = 0.8;

        // 모든 효과음을 Web Audio API 버퍼로 관리
        const sfxBuffers = {};
        const sfxAudioEls = {};
        const activeSfxSources = new Set();
        const activeHtmlSfxEls = new Set();
        let pageAudioMuted = false;
        const sfxFiles = {
            click:         './click.mp3',
            countdown:     './countdown.mp3',
            start:         './start.mp3',
            gameover:      './gameover.mp3',
            win:           './win.mp3',
            ball_throw:    './throw.mp3',
            throw_hit:     './throw_hit.mp3',
            fireball:      './fireball.mp3',
            throw_fireball:'./throw_fireball.mp3',
            bgm_title:        './bgm_title.mp3',
            mirrorball:       './mirrorball.mp3',
            throw_mirrorball: './throw_mirrorball.mp3',
            stripeball:       './stripeball.mp3',
            flashball:        './flashball.mp3',
        };
        Object.entries(sfxFiles).forEach(([key, url]) => {
            const audio = new Audio(url);
            audio.preload = 'auto';
            sfxAudioEls[key] = audio;
            try { audio.load(); } catch(e) {}

            const xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.responseType = 'arraybuffer';
            xhr.onload = () => {
                if (xhr.status === 200 || xhr.status === 0) {
                    audioCtx.decodeAudioData(xhr.response)
                        .then(buf => { sfxBuffers[key] = buf; })
                        .catch(e => console.warn('[SFX] Web Audio decode failed, using HTMLAudio fallback:', key, e));
                } else {
                    console.warn('[SFX] load failed, using HTMLAudio fallback:', key, xhr.status);
                }
            };
            xhr.onerror = () => console.warn('[SFX] XHR failed, using HTMLAudio fallback:', key);
            xhr.send();
        });

        function playHtmlSfx(key, volume, onended) {
            if (pageAudioMuted || document.visibilityState === 'hidden') return false;
            const base = sfxAudioEls[key];
            if (!base) {
                console.warn('[SFX] missing audio element:', key);
                if (onended) onended();
                return false;
            }

            const el = base.cloneNode(true);
            el.volume = volume !== undefined ? volume : 1.0;
            const cleanup = () => activeHtmlSfxEls.delete(el);
            activeHtmlSfxEls.add(el);
            el.addEventListener('ended', cleanup, { once: true });
            if (onended) el.addEventListener('ended', onended, { once: true });
            el.play().catch(e => {
                console.warn('[SFX] HTMLAudio play failed:', key, e);
                cleanup();
                if (!pageAudioMuted && document.visibilityState !== 'hidden' && onended) onended();
            });
            return true;
        }

        function playSfx(key, volume, onended) {
            if (pageAudioMuted || document.visibilityState === 'hidden') return;
            const buf = sfxBuffers[key];
            if (!buf) {
                playHtmlSfx(key, volume, onended);
                return;
            }
            audioCtx.resume().then(() => {
                if (pageAudioMuted || document.visibilityState === 'hidden') return;
                const src = audioCtx.createBufferSource();
                src.buffer = buf;
                const gain = audioCtx.createGain();
                gain.gain.value = volume !== undefined ? volume : 1.0;
                src.connect(gain);
                gain.connect(audioCtx.destination);
                activeSfxSources.add(src);
                src.onended = () => {
                    activeSfxSources.delete(src);
                    if (onended) onended();
                };
                src.start(0);
            }).catch(() => playHtmlSfx(key, volume, onended));
        }

        let lastHapticAt = 0;

        function triggerHaptic(type = 'light') {
            if (pageAudioMuted || document.visibilityState === 'hidden') return;
            const now = performance.now();
            if (type === 'light' && now - lastHapticAt < 35) return;
            lastHapticAt = now;

            try {
                const capHaptics = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
                if (capHaptics) {
                    if (type === 'error' && typeof capHaptics.notification === 'function') {
                        capHaptics.notification({ type: 'ERROR' }).catch(() => {});
                        return;
                    }
                    if (type === 'selection' && typeof capHaptics.selectionChanged === 'function') {
                        capHaptics.selectionChanged().catch(() => {});
                        return;
                    }
                    if (typeof capHaptics.impact === 'function') {
                        const styleMap = { selection: 'LIGHT', light: 'LIGHT', medium: 'MEDIUM', heavy: 'HEAVY', error: 'HEAVY' };
                        capHaptics.impact({ style: styleMap[type] || 'LIGHT' }).catch(() => {});
                        return;
                    }
                }
                if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
                    if (type === 'selection') navigator.vibrate(6);
                    else if (type === 'light') navigator.vibrate(12);
                    else if (type === 'medium') navigator.vibrate(25);
                    else if (type === 'heavy') navigator.vibrate([30, 25, 45]);
                    else if (type === 'error') navigator.vibrate([55, 35, 75]);
                }
            } catch (e) {}
        }

        function playClickSfx(e) {
            playSfx('click', 0.8);
            if (e && e.target && typeof e.target.closest === 'function' && e.target.closest('button')) {
                triggerHaptic('selection');
            }
        }

        document.addEventListener('click', playClickSfx, true);

        // bgm_title: GainNode로 볼륨/페이드 제어
        let titleBgmSource = null;
        let titleBgmEl = null;
        let titleGain = audioCtx.createGain();
        titleGain.gain.value = 0.6;
        titleGain.connect(audioCtx.destination);

        // HTMLAudioElement 폴백 (bgm_game.wav Web Audio API 실패 시)
        const bgmGameEl  = new Audio('./bgm_game.wav');
        bgmGameEl.loop   = true;
        bgmGameEl.volume = GAME_BGM_VOLUME;
        let bgmGameUseEl = false;
        const gameBgmGain = audioCtx.createGain();
        gameBgmGain.gain.value = GAME_BGM_VOLUME;
        gameBgmGain.connect(audioCtx.destination);

        function playThrow() {
            playSfx('ball_throw', 0.7);
        }

        // fetch 대신 XHR 사용 — file:// 프로토콜에서도 동작
        // 버퍼 끝의 무음 구간을 건너뛰기 위한 실제 루프 끝 지점 계산
        function detectLoopEnd(buffer) {
            const threshold = 0.001;
            // 모든 채널 중 가장 늦게 소리가 있는 샘플 위치를 찾음
            let lastSample = 0;
            for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
                const data = buffer.getChannelData(ch);
                for (let i = data.length - 1; i >= 0; i--) {
                    if (Math.abs(data[i]) > threshold) {
                        if (i > lastSample) lastSample = i;
                        break;
                    }
                }
            }
            // 약간의 여유(0.01초)를 두고 잘라냄
            return Math.min((lastSample + Math.floor(buffer.sampleRate * 0.01)) / buffer.sampleRate, buffer.duration);
        }

        function fadeTitleBgm(duration) {
            if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
            const steps = 30;
            const interval = duration / steps;
            const startVolume = titleBgmEl ? titleBgmEl.volume : titleGain.gain.value;
            const delta = startVolume / steps;
            fadeTimer = setInterval(() => {
                if (titleBgmEl) {
                    titleBgmEl.volume = Math.max(0, titleBgmEl.volume - delta);
                } else {
                    titleGain.gain.value = Math.max(0, titleGain.gain.value - delta);
                }
                const currentVolume = titleBgmEl ? titleBgmEl.volume : titleGain.gain.value;
                if (currentVolume <= 0) {
                    clearInterval(fadeTimer);
                    fadeTimer = null;
                    if (titleBgmSource) { try { titleBgmSource.stop(); } catch(e) {} titleBgmSource = null; }
                    if (titleBgmEl) {
                        titleBgmEl.pause();
                        titleBgmEl.currentTime = 0;
                        titleBgmEl = null;
                    }
                    titleGain.gain.value = 0.6;
                }
            }, interval);
        }
