<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>無限投手: 世界一への道</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Bangers&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-neon: #ccff00;
            --bg-dark: #0f172a;
            --block-bg: #1e293b;
            --text-white: #f8fafc;
        }

        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            font-family: 'Noto Sans JP', sans-serif;
            overflow: hidden;
            color: #0f172a;
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-wrapper {
            position: relative;
            width: 390px;
            height: 844px;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            transform-origin: center center;
        }

        /* --- Screens --- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
            padding: 20px;
            text-align: center;
        }

        .hidden {
            display: none !important;
            opacity: 0;
        }

        /* Splash Screen */
        #splash-screen {
            background-color: #ffffff;
            z-index: 20;
            gap: 0;
            cursor: pointer;
            touch-action: auto !important;
        }


        .splash-title {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 60px;
        }

        .splash-title-sub {
            font-size: 26px;
            background-color: #000000;
            color: #ffffff;
            padding: 6px 18px;
            display: inline-block;
            transform: rotate(-3deg);
            margin-bottom: 10px;
            font-weight: 900;
            border-radius: 4px;
            box-shadow: 4px 4px 0px var(--primary-neon);
        }

        .splash-title-main {
            font-size: 64px;
            color: #000000;
            display: block;
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow: 5px 5px 0px var(--primary-neon), 8px 8px 0px rgba(0,0,0,0.1);
        }

        .splash-touch-hint {
            font-size: 18px;
            font-weight: 700;
            color: #475569;
            letter-spacing: 0.5px;
            animation: blink 1.4s ease-in-out infinite;
        }

        .lang-btns {
            display: flex;
            gap: 16px;
            margin-top: 8px;
        }

        .lang-btn {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 12px 32px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-neon), 0 6px 0 2px #000000;
            transition: transform 0.1s, box-shadow 0.1s;
            font-family: 'Noto Sans JP', sans-serif;
            touch-action: auto !important;
        }

        .lang-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-neon), 0 2px 0 2px #000000;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.25; }
        }

        /* Intro Screen */
        #intro-screen {
            background-color: #ffffff;
            justify-content: flex-start;
            align-items: center;
            overflow-y: auto;
            padding-top: 20px;
            padding-bottom: 20px;
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch;
        }

        /* Game Title Styling */
        .game-title {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            font-size: 28px;
            color: #000;
            margin: -20px 0 25px 0;
            line-height: 1.2;
        }

        .game-title-sub {
            font-size: 18px;
            background-color: #000000;
            color: #ffffff;
            padding: 4px 12px;
            display: inline-block;
            transform: rotate(-3deg);
            margin-bottom: 6px;
            font-weight: 900;
            border-radius: 4px;
            box-shadow: 3px 3px 0px var(--primary-neon);
        }

        .game-title-main {
            font-size: 36px;
            color: #000000;
            display: block;
            font-weight: 900;
            letter-spacing: -1px;
            text-shadow: 3px 3px 0px var(--primary-neon), 5px 5px 0px rgba(0, 0, 0, 0.1);
        }

        .character-box {
            position: relative;
            margin-bottom: 25px;
        }

        /* Speech Bubble */
        .speech-bubble {
            position: relative;
            background: #000000;
            border-radius: 20px;
            padding: 15px 25px;
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 25px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            line-height: 1.5;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: #000000 transparent;
            display: block;
            width: 0;
            z-index: 1;
            transform: translateX(-50%);
        }

        /* 캐릭터 이미지 영역 */
        .main-character-img {
            width: 220px;
            height: 300px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-image: url('./character.png');
            margin: 0 auto;
        }

        .start-btn {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 12px 50px;
            font-size: 24px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--primary-neon), 0 6px 0 2px #000000;
            transition: transform 0.1s, box-shadow 0.1s;
            font-family: 'Noto Sans JP', sans-serif;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-neon), 0 2px 0 2px #000000;
        }

        /* Game UI */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
            pointer-events: none;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 8px 18px;
            border-radius: 15px;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.15);
        }

        .stat-label {
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            display: block;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 900;
            font-family: 'Bangers';
            color: #000000;
        }

        /* Game Over Screen */
        #game-over-screen {
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: flex-start;
            overflow-y: auto;
            padding-top: 30px;
            padding-bottom: 30px;
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch;
        }

        .game-over-title {
            font-family: 'Bangers';
            font-size: 64px;
            color: #ff4444;
            margin: 0;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
        }

        .final-score {
            font-size: 42px;
            margin: 10px 0;
            color: var(--primary-neon);
        }

        .leaderboard-btn {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            margin-top: 15px;
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 18px;
        }

        /* Leaderboard Modal */
        #leaderboard-modal {
            background: #1e293b;
            border: 3px solid var(--primary-neon);
            padding: 20px;
            border-radius: 20px;
            width: 90%;
            max-height: 70%;
            overflow-y: auto;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 6px;
            border-bottom: 1px solid #334155;
            border-radius: 8px;
        }

        .rank-item.is-me {
            background: rgba(204, 255, 0, 0.12);
            border: 2px solid var(--primary-neon);
            box-shadow: 0 0 10px rgba(204, 255, 0, 0.3);
        }

        .rank-item.is-me .rank-num,
        .rank-item.is-me .rank-name {
            color: var(--primary-neon);
            font-weight: 900;
        }

        #my-rank-badge {
            display: none;
            background: var(--primary-neon);
            color: #000;
            font-weight: 900;
            font-size: 16px;
            border-radius: 20px;
            padding: 6px 20px;
            margin-bottom: 8px;
        }

        .rank-num {
            font-weight: 900;
            color: var(--primary-neon);
            width: 40px;
        }

        .rank-score {
            font-family: 'Bangers';
            color: #fff;
        }

        .rank-name {
            flex: 1;
            color: #e2e8f0;
            text-align: left;
            padding-left: 10px;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }

        /* Name Entry */
        #rank-entry {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }

        .rank-announce {
            font-size: 22px;
            font-weight: 900;
            color: var(--primary-neon);
            margin: 0 0 14px;
            text-shadow: 0 0 12px rgba(204, 255, 0, 0.7);
        }

        .rank-announce span {
            font-family: 'Bangers';
            font-size: 32px;
        }

        .name-input {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--primary-neon);
            border-radius: 10px;
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            padding: 10px 20px;
            text-align: center;
            width: 240px;
            margin-bottom: 14px;
            font-family: 'Noto Sans JP', sans-serif;
            outline: none;
            -webkit-user-select: text !important;
            user-select: text !important;
            touch-action: auto !important;
            -webkit-touch-callout: default !important;
            pointer-events: auto !important;
        }

        .name-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }

        #action-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* input 태그에 전역 touch/select 제한 해제 */
        input {
            -webkit-user-select: text !important;
            user-select: text !important;
            touch-action: auto !important;
        }

        /* Fireball 알림 오버레이 */
        #fireball-announce {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 30;
            opacity: 0;
        }

        #fireball-announce.show {
            animation: fbAnnounce 1.2s ease-out forwards;
        }

        @keyframes fbAnnounce {
            0%   { opacity: 0; transform: scale(0.4); }
            20%  { opacity: 1; transform: scale(1.15); }
            50%  { opacity: 1; transform: scale(1.0); }
            80%  { opacity: 1; transform: scale(1.0); }
            100% { opacity: 0; transform: scale(0.9); }
        }

        #fireball-announce-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Mirrorball 알림 오버레이 */
        #mirrorball-announce {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 30;
            opacity: 0;
        }

        #mirrorball-announce.show {
            animation: fbAnnounce 1.8s ease-out forwards;
        }

        #mirrorball-announce-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ── 1:1 대전 ── */
        #battle-screen {
            background-color: #ffffff;
            z-index: 18;
            gap: 18px;
        }

        .battle-title {
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 900;
            font-size: 26px;
            color: #000;
            margin: 0 0 4px;
        }

        .battle-code-box {
            background: #000;
            color: var(--primary-neon);
            font-family: 'Bangers', cursive;
            font-size: 56px;
            letter-spacing: 10px;
            border-radius: 16px;
            padding: 10px 30px;
            text-align: center;
            box-shadow: 0 6px 0 var(--primary-neon);
        }

        .battle-waiting {
            color: #475569;
            font-size: 14px;
            font-weight: 700;
            animation: blink 1.2s ease-in-out infinite;
        }

        .battle-divider {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 700;
            margin: 0;
        }

        .battle-input {
            background: #f1f5f9;
            border: 2px solid #000;
            border-radius: 10px;
            font-size: 28px;
            font-family: 'Bangers', cursive;
            letter-spacing: 6px;
            text-align: center;
            width: 180px;
            padding: 8px 16px;
            outline: none;
            color: #000;
            -webkit-user-select: text !important;
            user-select: text !important;
            touch-action: auto !important;
            -webkit-touch-callout: default !important;
            pointer-events: auto !important;
        }

        /* 게임 중 상대 점수 HUD */
        #battle-hud {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: none;
            justify-content: center;
            align-items: center;
            gap: 0;
            z-index: 6;
            pointer-events: none;
        }

        .battle-hud-box {
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 11px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 0 0 10px 10px;
            text-align: center;
            min-width: 90px;
        }

        .battle-hud-box span {
            display: block;
            font-family: 'Bangers', cursive;
            font-size: 20px;
            color: var(--primary-neon);
            letter-spacing: 1px;
        }

        .battle-hud-vs {
            background: #000;
            color: var(--primary-neon);
            font-family: 'Bangers', cursive;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 0 0 8px 8px;
        }

        /* 대전 결과 화면 */
        #battle-result-screen {
            background: rgba(0,0,0,0.92);
            z-index: 25;
        }

        .battle-result-title {
            font-family: 'Bangers', cursive;
            font-size: 72px;
            margin: 0;
        }

        .battle-result-title.win  { color: var(--primary-neon); text-shadow: 0 0 30px rgba(204,255,0,0.8); }
        .battle-result-title.lose { color: #ff4444; text-shadow: 0 0 30px rgba(255,68,68,0.6); }
        .battle-result-title.draw { color: #fff; }

        .battle-scores {
            display: flex;
            gap: 20px;
            margin: 14px 0;
        }

        .battle-score-card {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 14px;
            padding: 12px 22px;
            text-align: center;
            min-width: 100px;
        }

        .battle-score-card.winner {
            border-color: var(--primary-neon);
            box-shadow: 0 0 16px rgba(204,255,0,0.4);
        }

        .battle-score-card .bsc-name {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 700;
        }

        .battle-score-card .bsc-score {
            font-family: 'Bangers', cursive;
            font-size: 38px;
            color: #fff;
        }

        /* 메인화면 랭킹 버튼 */
        #intro-ranking-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #000;
            color: #fff;
            border: 2px solid #000;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 900;
            padding: 6px 14px;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--primary-neon);
            font-family: 'Noto Sans JP', sans-serif;
            z-index: 2;
            touch-action: auto !important;
        }

        /* 메인화면 랭킹 모달 */
        #intro-ranking-modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 19;
            padding: 30px 20px;
        }

        #intro-ranking-modal .modal-inner {
            background: #1e293b;
            border: 3px solid var(--primary-neon);
            border-radius: 20px;
            width: 100%;
            max-height: 80%;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y !important;
        }

        /* 테스트 시작 번호 선택 */
        #test-start-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .test-sel-btn {
            background: #f1f5f9;
            color: #475569;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 900;
            padding: 7px 18px;
            cursor: pointer;
            font-family: 'Noto Sans JP', sans-serif;
            transition: all 0.15s;
        }

        .test-sel-btn.active {
            background: #000000;
            color: #ccff00;
            border-color: #000000;
            box-shadow: 0 3px 0 var(--primary-neon);
        }

        /* Countdown Screen */
        #countdown-screen {
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #countdown-text {
            font-family: 'Bangers', cursive;
            font-size: 100px;
            color: var(--primary-neon);
            text-shadow: 0 0 20px rgba(204, 255, 0, 0.8), 0 0 40px rgba(204, 255, 0, 0.4);
            transition: transform 0.1s ease-out;
            transform: scale(1);
        }

        .countdown-animate {
            animation: popIn 0.8s ease-out forwards;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
            100% {
                transform: scale(1.0);
                opacity: 1;
            }
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div id="game-wrapper">
        <div id="ui-layer" class="hidden">
            <div class="stat-box">
                <span class="stat-label">NEXT NUMBER</span>
                <span id="next-num" class="stat-value">1</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">SCORE</span>
                <span id="score" class="stat-value">0</span>
            </div>
        </div>

        <div id="splash-screen" class="screen">
            <h1 class="splash-title">
                <span class="splash-title-sub">超特訓！</span>
                <span class="splash-title-main">無限ピッチング</span>
            </h1>
            <div class="lang-btns">
                <button class="lang-btn" id="lang-ko-btn">한국어</button>
                <button class="lang-btn" id="lang-ja-btn">日本語</button>
            </div>
        </div>

        <div id="intro-screen" class="screen hidden">
            <button id="intro-ranking-btn" onclick="toggleIntroRanking()">🏆 TOP 100</button>

            <h1 class="game-title">
                <span class="game-title-sub" id="intro-title-sub">超特訓！</span>
                <span class="game-title-main" id="intro-title-main">無限ピッチング</span>
            </h1>
            <div class="speech-bubble" id="intro-bubble">
                よしっ！世界一のピッチャーになるために、<br>今日も特訓だ！
            </div>
            <div class="character-box">
                <div class="main-character-img"></div>
            </div>
            <button id="start-btn-id" class="start-btn">スタート</button>
            <button id="battle-btn" class="start-btn" onclick="openBattleScreen()" style="margin-top:8px;background:#1e293b;box-shadow:0 6px 0 var(--primary-neon),0 6px 0 2px #000;">1:1 대전</button>
            <div id="test-start-row">
                <button class="test-sel-btn" id="test-btn" onclick="selectTestMode()">TEST</button>
            </div>
        </div>

        <!-- 메인화면 랭킹 모달 -->
        <div id="intro-ranking-modal" class="hidden">
            <div class="modal-inner">
                <h3 style="margin:0 0 10px;color:#fff;text-align:center;">TOP 100</h3>
                <div id="intro-rank-list"></div>
                <button id="intro-ranking-close-btn" class="leaderboard-btn" style="margin-top:12px;display:block;width:100%;" onclick="toggleIntroRanking()">閉じる</button>
            </div>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h2 class="game-over-title">GAME OVER</h2>
            <div class="final-score">SCORE: <span id="final-score-val">0</span></div>

            <!-- 100위 안에 들었을 때 표시 -->
            <div id="rank-entry" class="hidden">
                <p class="rank-announce"><span id="my-rank-val">1</span><span id="rank-suffix">위 달성!</span></p>
                <input id="player-name-input" class="name-input" type="text" maxlength="12" placeholder="이름을 입력하세요 (최대 12자)" />
            </div>

            <div id="action-buttons">

    <script>
        /**
         * IMAGES
         */
        const cartImg = new Image();

        /**
         * AUDIO SYSTEM
         */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let gameBgmBuffer = null;
        let gameBgmSource = null;

        // 모든 효과음을 Web Audio API 버퍼로 관리
        const sfxBuffers = {};
        const sfxFiles = {
            countdown:     './countdown.mp3',
            start:         './start.mp3',
            gameover:      './gameover.mp3',
            win:           './win.mp3',
            ball_throw:    './throw.mp3',
            throw_hit:     './throw_hit.mp3',
            fireball:      './fireball.mp3',
            throw_fireball:'./throw_fireball.mp3',
            bgm_title:        './bgm_title.mp3',
            mirrorball:       './mirrorball.mp3',
            throw_mirrorball: './throw_mirrorball.mp3',
        };
        Object.entries(sfxFiles).forEach(([key, url]) => {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.responseType = 'arraybuffer';
            xhr.onload = () => {
                if (xhr.status === 200 || xhr.status === 0) {
                    audioCtx.decodeAudioData(xhr.response).then(buf => { sfxBuffers[key] = buf; }).catch(() => {});
                }
            };
            xhr.send();
        });

        function playSfx(key, volume) {
            const buf = sfxBuffers[key];
            if (!buf) { console.warn('[SFX] buffer not loaded:', key); return; }
            audioCtx.resume().then(() => {
                const src = audioCtx.createBufferSource();
                src.buffer = buf;
                const gain = audioCtx.createGain();
                gain.gain.value = volume !== undefined ? volume : 1.0;
                src.connect(gain);
                gain.connect(audioCtx.destination);
                src.start(0);
            });
        }

        // bgm_title: GainNode로 볼륨/페이드 제어
        let titleBgmSource = null;
        let titleGain = audioCtx.createGain();
        titleGain.gain.value = 0.6;
        titleGain.connect(audioCtx.destination);

        // HTMLAudioElement 폴백 (bgm_game.wav Web Audio API 실패 시)
        const bgmGameEl  = new Audio('./bgm_game.wav');
        bgmGameEl.loop   = true;
        bgmGameEl.volume = 0.7;
        let bgmGameUseEl = false;

        function playThrow() {
            playSfx('ball_throw', 0.7);
        }

        // fetch 대신 XHR 사용 — file:// 프로토콜에서도 동작
        // 버퍼 끝의 무음 구간을 건너뛰기 위한 실제 루프 끝 지점 계산
        function detectLoopEnd(buffer) {
            const threshold = 0.001;
            // 모든 채널 중 가장 늦게 소리가 있는 샘플 위치를 찾음
            let lastSample = 0;
            for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
                const data = buffer.getChannelData(ch);
                for (let i = data.length - 1; i >= 0; i--) {
                    if (Math.abs(data[i]) > threshold) {
                        if (i > lastSample) lastSample = i;
                        break;
                    }
                }
            }
            // 약간의 여유(0.01초)를 두고 잘라냄
            return Math.min((lastSample + Math.floor(buffer.sampleRate * 0.01)) / buffer.sampleRate, buffer.duration);
        }

        let gameBgmLoopEnd = 0;

        (function loadGameBgm() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', './bgm_game.wav', true);
            xhr.responseType = 'arraybuffer';
            xhr.onload = () => {
                if (xhr.status === 200 || xhr.status === 0) {
                    audioCtx.decodeAudioData(xhr.response)
                        .then(decoded => {
                            gameBgmBuffer = decoded;
                            gameBgmLoopEnd = detectLoopEnd(decoded);
                            console.log('[BGM] loopEnd:', gameBgmLoopEnd, '/ duration:', decoded.duration);
                        })
                        .catch(() => { bgmGameUseEl = true; });
                } else {
                    bgmGameUseEl = true;
                }
            };
            xhr.onerror = () => { bgmGameUseEl = true; };
            xhr.send();
        })();

        let fadeTimer = null;

        function stopAllBgm() {
            if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
            if (titleBgmSource) { try { titleBgmSource.stop(); } catch(e) {} titleBgmSource = null; }
            titleGain.gain.value = 0.6;
            if (gameBgmSource) { try { gameBgmSource.stop(); } catch(e) {} gameBgmSource = null; }
            bgmGameEl.pause();
            bgmGameEl.currentTime = 0;
        }

        function playTitleBgm() {
            if (!sfxBuffers['bgm_title']) return;
            audioCtx.resume().then(() => {
                if (titleBgmSource) { try { titleBgmSource.stop(); } catch(e) {} }
                titleGain.gain.value = 0.6;
                const src = audioCtx.createBufferSource();
                src.buffer = sfxBuffers['bgm_title'];
                src.loop = true;
                src.connect(titleGain);
                src.start(0);
                titleBgmSource = src;
            });
        }

        function fadeTitleBgm(duration) {
            if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
            const steps = 30;
            const interval = duration / steps;
            const delta = titleGain.gain.value / steps;
            fadeTimer = setInterval(() => {
                titleGain.gain.value = Math.max(0, titleGain.gain.value - delta);
                if (titleGain.gain.value <= 0) {
                    clearInterval(fadeTimer);
                    fadeTimer = null;
                    if (titleBgmSource) { try { titleBgmSource.stop(); } catch(e) {} titleBgmSource = null; }
                    titleGain.gain.value = 0.6;
                }
            }, interval);
        }

        // ── 언어 시스템 ──────────────────────────────────────────
        let currentLang = 'ja';

        const TEXTS = {
            ja: {
                titleSub:    '超特訓！',
                titleMain:   '無限ピッチング',
                introBubble: 'よしっ！世界一のピッチャーになるために、<br>今日も特訓だ！',
                startBtn:    'スタート',
                rankSuffix:  '位達成！',
                nameHolder:  '名前を入力してください（最大12文字）',
                registerBtn: '登録して続ける',
                retryBtn:    'リトライ',
                rankingBtn:  'ランキング',
                closeBtn:    '閉じる',
                homeBtn:     'メイン画面へ',
                rankingClose:'閉じる',
                instruction: 'ドラッグして数字の順番に\nボールを当てよう！',
            },
            ko: {
                titleSub:    '초특훈！',
                titleMain:   '무한 피칭',
                introBubble: '좋아! 세계 최고의 투수가 되기 위해,<br>오늘도 특훈이다!',
                startBtn:    '스타트',
                rankSuffix:  '위 달성!',
                nameHolder:  '이름을 입력하세요 (최대 12자)',
                registerBtn: '등록하고 계속하기',
                retryBtn:    '다시 하기',
                rankingBtn:  '랭킹',
                closeBtn:    '닫기',
                homeBtn:     '메인화면',
                rankingClose:'닫기',
                instruction: '드래그하여 숫자 순서대로\n공을 맞추세요.',
            }
        };

        function applyLang(lang) {
            currentLang = lang;
            const t = TEXTS[lang];
            document.getElementById('intro-title-sub').innerText   = t.titleSub;
            document.getElementById('intro-title-main').innerText  = t.titleMain;
