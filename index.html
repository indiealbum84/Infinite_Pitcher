        }

        function clearRematchListener(roomId = battleRoomId) {
            if (!rematchListener || !roomId) return;
            battleRef.child(roomId + '/rematch').off('value', rematchListener);
            rematchListener = null;
        }

        function leaveBattleRoom(removeHostRoom) {
            const roomId = battleRoomId;
            const playerId = battlePlayerId;
            const role = battleRole;

            clearBattleRoomListener(roomId);
            clearBattleResultListener(roomId);
            clearRematchListener(roomId);
            if (rematchTimer) { clearInterval(rematchTimer); rematchTimer = null; }

            if (roomId) {
                if (role === 'host' && removeHostRoom) {
                    battleRef.child(roomId).remove();
                } else if (playerId) {
                    battleRef.child(roomId + '/players/' + playerId).remove();
                }
            }

            battleRoomId = null;
            battleRole = null;
            battlePlayerId = null;
            battlePlayers = {};
            battleMode = false;
            battleStarted = false;
            battleResultShown = false;
            battleRematchStarted = false;
            battleProfileReady = false;
        }

        function returnToIntroAfterBattle(removeHostRoom = false) {
            leaveBattleRoom(removeHostRoom);
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('battle-result-screen').classList.add('hidden');
            document.getElementById('battle-hud').style.display = 'none';
            stopAllBgm();
            gameState = 'INTRO';
            document.getElementById('intro-screen').classList.remove('hidden');
            playTitleBgm();
        }

        function openBattleScreen() {
            if (testMode) {
                alert(textFor('alertTestBattle'));
                return;
            }

            leaveBattleRoom(true);
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('battle-screen').classList.remove('hidden');
            document.getElementById('battle-result-screen').classList.add('hidden');
            document.getElementById('battle-code-input').value = '';
            document.getElementById('battle-room-code').innerText = '----';
            document.getElementById('battle-player-list').innerHTML = '';
            hydrateBattleNameInput();
            applyBattleLang();
            showBattleProfileStep();

            const nameInput = document.getElementById('battle-name-input');
            setTimeout(() => nameInput && nameInput.focus(), 50);
        }

        function createBattleRoom(hostName) {
            const code = genCode();
            const playerId = genBattlePlayerId();
            const hostPlayer = {
                score: 0,
                done: false,
                rank: null,
                finishOrder: null,
                finishedAt: null,
                name: hostName,
                isHost: true,
                joinedAt: Date.now()
            };

            battleRoomId = code;
            battleRole = 'host';
            battlePlayerId = playerId;
            battlePlayers = { [playerId]: hostPlayer };

            battleRef.child(code).set({
                code,
                hostId: playerId,
                maxPlayers: MAX_BATTLE_PLAYERS,
                players: battlePlayers,
                status: 'waiting',
                joinLocked: false,
                createdAt: Date.now()
            }).then(() => listenBattleRoom(code));

            document.getElementById('battle-room-code').innerText = code;
            renderBattleLobby({ players: battlePlayers, status: 'waiting' });
        }

        function joinBattleRoom() {
            const code = document.getElementById('battle-code-input').value.trim();
            if (code.length !== 4) return;
            if (battleRoomId === code) return;

            const playerId = genBattlePlayerId();
            const joinedAt = Date.now();
            const nickname = getBattleNickname();
            if (!nickname) {
                alert(textFor('alertNickname'));
                showBattleProfileStep();
                const input = document.getElementById('battle-name-input');
                if (input) input.focus();
                return;
            }

            battleRef.child(code).once('value').then(snap => {
                const room = snap.val();
                if (!room || room.status !== 'waiting' || room.joinLocked) {
                    alert(textFor('alertRoomFull'));
                    return;
                }

                battleRef.child(code + '/players').transaction(players => {
                    players = players || {};
                    const playerCount = Object.keys(players).length;
                    if (playerCount >= MAX_BATTLE_PLAYERS) return;

                    players[playerId] = {
                        score: 0,
                        done: false,
                        rank: null,
                        finishOrder: null,
                        finishedAt: null,
                        name: nickname || `P${playerCount + 1}`,
                        isHost: false,
                        joinedAt
                    };
                    return players;
                }, (error, committed) => {
                    if (error || !committed) {
                        alert(textFor('alertRoomFull'));
                        return;
                    }

                    leaveBattleRoom(true);
                    battleRoomId = code;
                    battleRole = 'guest';
                    battlePlayerId = playerId;
                    battleStarted = false;
                    battleResultShown = false;
                    battleRematchStarted = false;
                    battleProfileReady = true;
                    document.getElementById('battle-room-code').innerText = code;
                    showBattleRoomStep();
                    listenBattleRoom(code);
                });
            }).catch(() => {
                alert(textFor('alertRoomFull'));
            });
        }

        function startBattleRoom() {
            if (!battleRoomId || battleRole !== 'host') return;
            battleRef.child(battleRoomId).once('value').then(snap => {
                const room = snap.val();
                const players = getBattlePlayerList(room);
                if (!room || room.status !== 'waiting' || players.length < 2) {
                    alert(textFor('alertNeedPlayers'));
                    return;
                }

                const updates = {
                    status: 'playing',
                    startedAt: Date.now(),
                    endedAt: null,
                    finishCounter: 0,
                    rematch: null
                };
                players.forEach(player => {
                    updates['players/' + player.id + '/score'] = 0;
                    updates['players/' + player.id + '/done'] = false;
                    updates['players/' + player.id + '/rank'] = null;
                    updates['players/' + player.id + '/finishOrder'] = null;
                    updates['players/' + player.id + '/finishedAt'] = null;
                });
                battleRef.child(battleRoomId).update(updates);
            });
        }

        function listenBattleRoom(roomId) {
            clearBattleRoomListener(roomId);
            battleListener = snap => {
                const room = snap.val();
                if (!room) {
                    if (battleRoomId === roomId) {
                        returnToIntroAfterBattle();
                    }
                    return;
                }

                battlePlayers = room.players || {};
                if (!battlePlayers[battlePlayerId]) {
                    if (room.status === 'waiting' || room.status === 'playing' || room.status === 'closed') {
                        returnToIntroAfterBattle();
                    }
                    return;
                }

                if (room.status === 'closed') {
                    returnToIntroAfterBattle(battleRole === 'host');
                    return;
                }

                if (room.status === 'waiting') {
                    clearBattleResultListener();
                    clearRematchListener();
                    if (rematchTimer) { clearInterval(rematchTimer); rematchTimer = null; }
                    battleStarted = false;
                    battleMode = false;
                    battleResultShown = false;
                    battleRematchStarted = false;
                    document.getElementById('battle-result-screen').classList.add('hidden');
                    document.getElementById('battle-hud').style.display = 'none';
                    document.getElementById('battle-screen').classList.remove('hidden');
                    document.getElementById('intro-screen').classList.add('hidden');
                    showBattleRoomStep();
                    renderBattleLobby(room);
                    return;
                }

                if (room.status === 'playing') {
                    renderBattleHud(room);
                    if (battlePlayers[battlePlayerId].done) {
                        if (battleMode) {
                            battleMode = false;
                            gameState = 'GAMEOVER';
                            stopAllBgm();
                        }
                        showBattleResult(room);
                    } else {
                        startBattle();
                    }
                    return;
                }

                if (room.status === 'ended') {
                    renderBattleHud(room);
                    if (battleMode) {
                        battleMode = false;
                        gameState = 'GAMEOVER';
                        stopAllBgm();
                    }
                    showBattleResult(room);
                }
            };
            battleRef.child(roomId).on('value', battleListener);
        }

        function renderBattleLobby(room) {
            const players = getBattlePlayerList(room);
            const isHost = battleRole === 'host';
            const waitingEl = document.getElementById('battle-waiting-text');
            const startBtn = document.getElementById('battle-start-btn');
            const listEl = document.getElementById('battle-player-list');

            waitingEl.innerText = isHost
                ? textFor('lobbyStartable')(players.length)
                : textFor('lobbyWaitingHost')(players.length);

            startBtn.style.display = isHost ? 'block' : 'none';
            startBtn.disabled = !isHost || players.length < 2;
            startBtn.innerText = textFor('battleStart');

            listEl.innerHTML = players.map((player, index) => {
                const label = escapeBattleText(getBattlePlayerLabel(player, index));
                const meClass = player.id === battlePlayerId ? ' me' : '';
                return `<div class="battle-player-pill${meClass}">${label}</div>`;
            }).join('');
        }

        function renderBattleHud(room) {
            const hud = document.getElementById('battle-hud');
            const players = getBattlePlayerList(room);
            hud.innerHTML = players.map((player, index) => {
                const label = escapeBattleText(getBattlePlayerLabel(player, index));
                const scoreText = Number(player.score || 0);
                const meClass = player.id === battlePlayerId ? ' me' : '';
                return `<div class="battle-hud-box${meClass}">${label}<span>${scoreText}</span></div>`;
            }).join('');
        }

        function applyBattleLang() {
            document.getElementById('battle-btn').innerText            = TEXTS[currentLang].battleBtn;
            document.getElementById('battle-screen-title').innerText   = textFor('battleScreenTitle');
            document.getElementById('battle-waiting-text').innerText   = textFor('battleWaiting');
            document.getElementById('battle-cancel-btn').innerText     = textFor('battleCancel');
            document.getElementById('battle-join-btn').innerText       = textFor('battleJoin');
            document.getElementById('battle-exit-btn').innerText       = textFor('battleExit');
            document.getElementById('battle-start-btn').innerText      = textFor('battleStart');
            document.getElementById('battle-name-label').innerText     = textFor('battleNameLabel');
            document.getElementById('battle-name-input').placeholder   = textFor('battleNamePlaceholder');
            document.getElementById('battle-name-hint').innerText      = textFor('battleNameHint');
            document.getElementById('battle-name-next-btn').innerText  = textFor('battleNameNext');
            document.getElementById('battle-code-label').innerText     = textFor('battleCodeLabel');
            document.getElementById('battle-join-label').innerText     = textFor('battleJoinLabel');
            document.getElementById('battle-divider').innerText        = textFor('battleDivider');
            setBattleRematchButtonText();
        }

        function startBattle() {
            if (battleStarted) return;
            battleStarted = true;
            battleResultShown = false;
            battleRematchStarted = false;
            clearBattleResultListener();
            clearRematchListener();
            battleMode = true;

            document.getElementById('battle-hud').style.display = 'flex';
            renderBattleHud({ players: battlePlayers });

            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('battle-result-screen').classList.add('hidden');

            startGame();
        }

        function battleSyncScore() {
            if (!battleMode || !battleRoomId || !battlePlayerId) return;
            if (battlePlayers[battlePlayerId]) {
                battlePlayers[battlePlayerId].score = score;
                renderBattleHud({ players: battlePlayers });
            }
            battleRef.child(battleRoomId + '/players/' + battlePlayerId + '/score').set(score);
        }

        function battleGameOver() {
            if (!battleMode || !battleRoomId || !battlePlayerId) return;
            battleMode = false;
            const savedScore = score;
            if (battlePlayers[battlePlayerId]) {
                battlePlayers[battlePlayerId].score = savedScore;
                battlePlayers[battlePlayerId].done = true;
                renderBattleHud({ players: battlePlayers });
            }
            finishBattlePlayer(savedScore);
        }

        function finishBattlePlayer(finalScore) {
            const roomId = battleRoomId;
            const playerId = battlePlayerId;
            const finishedAt = Date.now();
            battleRef.child(roomId).transaction(room => {
                if (!room || !room.players || !room.players[playerId]) return room;
                if (room.players[playerId].done) return room;

                const players = room.players;
                const ids = Object.keys(players);
                const total = ids.length;
                const doneCount = ids.filter(id => players[id].done).length;
                const finishOrder = doneCount + 1;

                players[playerId] = {
                    ...players[playerId],
                    score: finalScore,
                    done: true,
                    finishOrder,
                    rank: total - finishOrder + 1,
                    finishedAt
                };

                const remainingIds = ids.filter(id => !players[id].done);
                let finishCounter = finishOrder;
                if (remainingIds.length === 1) {
                    const winnerId = remainingIds[0];
                    players[winnerId] = {
                        ...players[winnerId],
                        done: true,
                        finishOrder: total,
                        rank: 1,
                        finishedAt,
                        score: Number(players[winnerId].score || 0)
                    };
                    room.status = 'ended';
                    room.endedAt = finishedAt;
                    finishCounter = total;
                } else if (remainingIds.length === 0) {
                    room.status = 'ended';
                    room.endedAt = finishedAt;
                }

                room.players = players;
                room.finishCounter = finishCounter;
                return room;
            }, (error, committed, snap) => {
                const room = snap && snap.val();
                if (!error && committed && room) {
                    battlePlayers = room.players || {};
                    showBattleResult(room);
                }
            });
        }

        function showBattleResult(room) {
            const firstResultRender = !battleResultShown;
            battlePlayers = room.players || {};
            const players = getBattlePlayerList(room).sort((a, b) => {
                const rankA = Number(a.rank || 999);
                const rankB = Number(b.rank || 999);
                const rankDiff = rankA - rankB;
                const scoreDiff = Number(b.score || 0) - Number(a.score || 0);
                return rankDiff || scoreDiff || ((a.joinedAt || 0) - (b.joinedAt || 0));
            });
            const myPlayer = players.find(player => player.id === battlePlayerId) || { score: 0 };
            const myScore = Number(myPlayer.score || 0);
            const myRank = Number(myPlayer.rank || 0);
            const topScore = players.length ? Number(players[0].score || 0) : 0;

            document.getElementById('battle-hud').style.display = 'none';
            document.getElementById('game-over-screen').classList.add('hidden');

            let resultText, resultClass;
            if (myRank === 1) {
                resultText = textFor('resultWin');
                resultClass = 'win';
            } else if (myRank > 1) {
                resultText = textFor('rankText')(myRank);
                resultClass = 'lose';
            } else {
                const topCount = players.filter(player => Number(player.score || 0) === topScore).length;
                if (myScore === topScore && topCount === 1) {
                    resultText = textFor('resultWin');
                    resultClass = 'win';
                } else if (myScore === topScore) {
                    resultText = textFor('resultDraw');
                    resultClass = 'draw';
                } else {
                    resultText = textFor('resultLose');
                    resultClass = 'lose';
                }
            }

            if (firstResultRender) {
                if (resultClass === 'win') playSfx('win', 1.0);
                else playSfx('gameover', 1.0);
            }

            const titleEl = document.getElementById('battle-result-title');
            titleEl.innerText = resultText;
            titleEl.className = 'battle-result-title ' + resultClass;

            document.getElementById('battle-score-list').innerHTML = players.map((player, index) => {
                const label = escapeBattleText(getBattlePlayerLabel(player, index));
                const scoreText = Number(player.score || 0);
                const rankText = player.rank ? player.rank : index + 1;
                const meClass = player.id === battlePlayerId ? ' me' : '';
                return `<div class="battle-score-card${meClass}">
                    <div class="bsc-name">${rankText}. ${label}</div>
                    <div class="bsc-score">${scoreText}</div>
                </div>`;
            }).join('');

            document.getElementById('battle-result-screen').classList.remove('hidden');
            battleResultShown = true;
            if (room.status === 'ended') {
                if (!battleRematchStarted) startRematchCountdown();
            } else {
                document.getElementById('battle-rematch-btn').disabled = true;
                document.getElementById('rematch-countdown').innerText = '-';
                document.getElementById('rematch-status').innerText = textFor('othersPlaying');
            }
        }

        function cancelBattle() {
            leaveBattleRoom(true);
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('battle-hud').style.display = 'none';
            document.getElementById('intro-screen').classList.remove('hidden');
        }

        function startRematchCountdown() {
            clearRematchListener();
            if (rematchTimer) { clearInterval(rematchTimer); rematchTimer = null; }
            battleRematchStarted = true;

            rematchSeconds = 10;
            setBattleRematchButtonText(rematchSeconds);
            document.getElementById('rematch-status').innerText = '';
            document.getElementById('battle-rematch-btn').disabled = false;

            rematchTimer = setInterval(() => {
                rematchSeconds--;
                document.getElementById('rematch-countdown').innerText = rematchSeconds;
                if (rematchSeconds <= 0) {
                    clearInterval(rematchTimer);
                    rematchTimer = null;
                    document.getElementById('battle-rematch-btn').disabled = true;
                    document.getElementById('rematch-status').innerText = textFor('waitingHost');
                    if (battleRole === 'host') setTimeout(finalizeRematchLobby, 300);
                }
            }, 1000);

            rematchListener = snap => {
                const val = snap.val() || {};
                const players = getBattlePlayerList({ players: battlePlayers });
                const readyCount = players.filter(player => val[player.id] === true).length;
                const myReady = val[battlePlayerId] === true;

                if (rematchTimer || myReady) {
                    document.getElementById('rematch-status').innerText = textFor('rematchJoinStatus')(readyCount, players.length);
                }
            };
            battleRef.child(battleRoomId + '/rematch').on('value', rematchListener);
        }

        function requestRematch() {
            if (!battleRoomId || !battlePlayerId) return;
            document.getElementById('battle-rematch-btn').disabled = true;
            document.getElementById('rematch-status').innerText = textFor('rematchReady');
            battleRef.child(battleRoomId + '/rematch/' + battlePlayerId).set(true);
        }

        function finalizeRematchLobby() {
            if (!battleRoomId || battleRole !== 'host') return;
            battleRef.child(battleRoomId).once('value').then(snap => {
                const room = snap.val();
                if (!room || room.status !== 'ended' || !room.players) return;

                const rematch = room.rematch || {};
                const readyIds = Object.keys(rematch).filter(id => rematch[id] === true && room.players[id]);
                const hostId = room.hostId;
                if (!readyIds.includes(hostId) || readyIds.length < 2) {
                    battleRef.child(battleRoomId).update({
                        status: 'closed',
                        rematch: null
                    });
                    return;
                }

                const nextPlayers = {};
                readyIds
                    .sort((a, b) => (room.players[a].joinedAt || 0) - (room.players[b].joinedAt || 0))
                    .forEach(id => {
                        nextPlayers[id] = {
                            ...room.players[id],
                            score: 0,
                            done: false,
                            rank: null,
                            finishOrder: null,
                            finishedAt: null,
                            isHost: id === hostId
                        };
                    });

                battleRef.child(battleRoomId).update({
                    players: nextPlayers,
                    status: 'waiting',
                    joinLocked: true,
                    finishCounter: 0,
                    rematch: null,
                    startedAt: null
                });
            });
        }

        function loadIntroRankList() {
            const list = document.getElementById('intro-rank-list');
            updateCountryTabLabels();
            const cached = getCachedRanks(currentLeaderboardScope);
            if (cached.length > 0) renderRankRows(list, cached, null, null);
            else list.innerHTML = `<div style="color:#aaa;padding:20px;text-align:center;">${textFor('loadingRanks')}</div>`;

            fetchRanks((ranks) => {
                if (ranks.length === 0) {
                    list.innerHTML = `<div style="color:#aaa;padding:20px;text-align:center;">${textFor('emptyRanks')}</div>`;
                    return;
                }
                renderRankRows(list, ranks, null, null);
            });
        }

        function toggleIntroRanking() {
            const modal = document.getElementById('intro-ranking-modal');
            const isHidden = modal.classList.contains('hidden');
            if (isHidden) {
                modal.classList.remove('hidden');
                const inner = modal.querySelector('.modal-inner');
                inner.scrollTop = 0;
                // 터치 드래그 스크롤 직접 구현
                if (!inner._touchBound) {
                    inner._touchBound = true;
                    let startY = 0, startScroll = 0;
                    inner.addEventListener('touchstart', e => {
                        startY = e.touches[0].clientY;
                        startScroll = inner.scrollTop;
                    }, { passive: true });
                    inner.addEventListener('touchmove', e => {
                        const dy = startY - e.touches[0].clientY;
                        inner.scrollTop = startScroll + dy;
                        e.stopPropagation();
                    }, { passive: true });
                }
                loadIntroRankList();
            } else {
                modal.classList.add('hidden');
            }
        }

        function goToMain() {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('leaderboard-modal').classList.add('hidden');
            document.getElementById('ui-layer').classList.add('hidden');
            stopAllBgm();
            gameState = 'INTRO';
            document.getElementById('intro-screen').classList.remove('hidden');
            playTitleBgm();
        }

        function exitBattle() {
            leaveBattleRoom(false);
            document.getElementById('battle-result-screen').classList.add('hidden');
            document.getElementById('battle-hud').style.display = 'none';
            stopAllBgm();
            gameState = 'INTRO';
            document.getElementById('intro-screen').classList.remove('hidden');
            playTitleBgm();
        }

    </script>
